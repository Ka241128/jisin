<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART QUAKE VIEWER - LIVE & MESH</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

    <style>
        :root {
            --bg-dark: #05070a;
            --panel-bg: rgba(10, 14, 23, 0.92);
            --border-color: rgba(255, 255, 255, 0.12);
            --accent-blue: #00d2ff;
            --accent-red: #ff0055;
            --font-mono: 'JetBrains Mono', monospace, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg-dark); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #f1f5f9; }

        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; background: #030407; }
        .leaflet-tile { filter: brightness(0.55) invert(100%) contrast(3) hue-rotate(200deg) saturate(0.3); }

        /* P波・S波リアルタイムアニメーション */
        .wave-p { stroke: #00d2ff; stroke-width: 2; fill: rgba(0, 210, 255, 0.05); stroke-dasharray: 4 4; pointer-events: none; }
        .wave-s { stroke: #ff0055; stroke-width: 2.5; fill: rgba(255, 0, 85, 0.12); pointer-events: none; }

        .epicenter-marker { display: flex; justify-content: center; align-items: center; }
        .epicenter-cross { font-size: 30px; font-weight: 900; color: #ff0055; text-shadow: 0 0 14px #ff0055, 0 0 24px #ff0055; animation: pulse 0.8s infinite alternate ease-in-out; }
        @keyframes pulse { from { transform: scale(0.9); } to { transform: scale(1.3); } }

        #ui-container { position: absolute; top: 16px; left: 16px; z-index: 1000; width: 360px; max-width: calc(100vw - 32px); }
        .glass-panel { background: var(--panel-bg); backdrop-filter: blur(16px); border: 1px solid var(--border-color); border-radius: 14px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .panel-header { padding: 12px 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .brand-title { font-size: 11px; font-weight: 800; color: var(--accent-blue); letter-spacing: 0.1em; }

        .status-strip { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; font-size: 11px; background: rgba(0,0,0,0.4); border-bottom: 1px solid var(--border-color); }
        .status-badge { display: flex; align-items: center; gap: 6px; font-weight: 700; }
        .dot-live { width: 8px; height: 8px; border-radius: 50%; background: #00ff88; box-shadow: 0 0 8px #00ff88; }
        .dot-live.offline { background: #ff4757; box-shadow: 0 0 8px #ff4757; }

        .live-banner { background: var(--accent-blue); color: #000; font-size: 10px; font-weight: 900; text-align: center; padding: 3px 0; letter-spacing: 0.1em; display: none; }

        .eq-detail-card { padding: 16px; }
        .eq-location { font-size: 22px; font-weight: 900; color: #fff; margin: 4px 0 10px 0; line-height: 1.2; }
        .eq-metrics-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .metric-box { background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-color); padding: 8px; border-radius: 8px; text-align: center; }
        .metric-label { font-size: 9px; color: #64748b; font-weight: 700; }
        .metric-val { font-size: 15px; font-weight: 800; font-family: var(--font-mono); }

        /* 伝播タイマー表示 */
        .wave-timer-box { font-size: 11px; font-weight: 800; color: var(--accent-blue); background: rgba(0, 210, 255, 0.1); border: 1px solid rgba(0, 210, 255, 0.3); padding: 4px 10px; border-radius: 6px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; }

        #history-scroll-list { max-height: 180px; overflow-y: auto; padding: 0 12px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
        .history-card { display: grid; grid-template-columns: 48px 1fr auto; align-items: center; gap: 8px; padding: 8px 10px; background: rgba(255, 255, 255, 0.02); border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
        .history-card.active { border-color: var(--accent-blue); background: rgba(0, 210, 255, 0.08); }
        .scale-badge { font-size: 11px; font-weight: 900; text-align: center; padding: 3px 0; border-radius: 4px; color: #000; font-family: var(--font-mono); }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="ui-container">
        <div class="glass-panel">
            <div class="panel-header">
                <span class="brand-title">SMART QUAKE LIVE</span>
                <span style="font-size: 10px; color: #64748b; font-weight: 800;">面補間シェーディング有効</span>
            </div>
            <div id="live-banner" class="live-banner">⚡ 最新情報 受信即時同期</div>
            <div class="status-strip">
                <div class="status-badge">
                    <div id="live-indicator" class="dot-live offline"></div>
                    <span id="live-status-text">接続待機中</span>
                </div>
                <div id="live-clock" style="font-family: var(--font-mono); color: #94a3b8;">--:--:--</div>
            </div>

            <div id="earthquake-main-view">
                <div class="eq-detail-card">
                    <div style="text-align: center; font-size: 12px; color: #64748b;">データ受信待機中...</div>
                </div>
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center; padding: 10px 16px 6px 16px;">
                <span style="font-size: 10px; color: #64748b; font-weight: 800;">受信ログ</span>
                <button id="btn-live-reset" style="font-size:10px; font-weight:800; padding:2px 8px; border-radius:4px; background:rgba(0,210,255,0.2); color:var(--accent-blue); border:1px solid var(--accent-blue); cursor:pointer; display:none;" onclick="updateDisplay(0)">LIVEに戻る</button>
            </div>
            <div id="history-scroll-list"></div>
        </div>
    </div>

    <script>
        const map = L.map('map', { zoomControl: false }).setView([36.2048, 138.2529], 5);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        const activeLayersGroup = L.layerGroup().addTo(map);
        let earthquakeList = [];
        let currentViewingIndex = 0;
        let wsInstance = null;
        let heartbeatTimer = null;
        let animationFrameId = null;
        let reconnectAttempts = 0;

        setInterval(() => {
            document.getElementById('live-clock').textContent = new Date().toLocaleTimeString('ja-JP');
        }, 1000);

        function isValidCoordinate(lat, lng) {
            return typeof lat === 'number' && typeof lng === 'number' &&
                   lat > 20 && lat < 50 && lng > 120 && lng < 150 &&
                   lat !== -1 && lng !== -1;
        }

        function parseScale(scale) {
            const scaleMap = { 10: "1", 20: "2", 30: "3", 40: "4", 45: "5弱", 50: "5強", 55: "6弱", 60: "6強", 70: "7" };
            return scaleMap[scale] || "不明";
        }

        // 気象庁規格震度カラー (RGBA配列)
        function getScaleRGBA(scale) {
            if (scale >= 60) return "rgba(180, 0, 0, ";      // 6強・7 (深赤)
            if (scale >= 50) return "rgba(255, 0, 85, ";     // 5強・6弱 (赤)
            if (scale >= 40) return "rgba(255, 120, 0, ";    // 5弱 (橙)
            if (scale >= 30) return "rgba(255, 210, 0, ";    // 3・4 (黄)
            if (scale >= 20) return "rgba(0, 150, 255, ";    // 2 (青)
            if (scale >= 10) return "rgba(0, 200, 120, ";    // 1 (緑)
            return "rgba(100, 110, 120, ";
        }

        function getScaleHEX(scale) {
            if (scale >= 60) return "#b40000";
            if (scale >= 50) return "#ff0055";
            if (scale >= 40) return "#ff7800";
            if (scale >= 30) return "#ffd200";
            if (scale >= 20) return "#0096ff";
            if (scale >= 10) return "#00c878";
            return "#646e78";
        }

        // --- ★面的な震度分布（色塗り）グラデーション描画エンジン★ ---
        function renderShadedIntensityMesh(points) {
            if (!points || points.length === 0) return;

            points.forEach(pt => {
                if (isValidCoordinate(pt.latitude, pt.longitude) && pt.scale >= 10) {
                    const radiusMeters = Math.min(80000, Math.max(15000, (pt.scale / 10) * 12000));
                    const baseColor = getScaleRGBA(pt.scale);

                    // 多層円グラデーションで「エリア塗りつぶし」効果を合成
                    L.circle([pt.latitude, pt.longitude], {
                        radius: radiusMeters,
                        stroke: false,
                        fillColor: getScaleHEX(pt.scale),
                        fillOpacity: 0.25,
                        interactive: false
                    }).addTo(activeLayersGroup);

                    L.circle([pt.latitude, pt.longitude], {
                        radius: radiusMeters * 0.5,
                        stroke: false,
                        fillColor: getScaleHEX(pt.scale),
                        fillOpacity: 0.45,
                        interactive: false
                    }).addTo(activeLayersGroup);

                    // 中心観測点ピン
                    L.circleMarker([pt.latitude, pt.longitude], {
                        radius: Math.max(3, (pt.scale / 10) * 2),
                        fillColor: getScaleHEX(pt.scale),
                        color: "#ffffff",
                        weight: 1,
                        fillOpacity: 0.9
                    }).bindPopup(`<b>${pt.addr}</b><br>震度: ${parseScale(pt.scale)}`).addTo(activeLayersGroup);
                }
            });
        }

        // --- P波・S波 リアルタイム物理シミュレーション (1/60秒更新) ---
        function startRealtimeWavePropagation(lat, lng, originTimeMs, depthKm) {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            const pCircle = L.circle([lat, lng], { className: 'wave-p', radius: 0 }).addTo(activeLayersGroup);
            const sCircle = L.circle([lat, lng], { className: 'wave-s', radius: 0 }).addTo(activeLayersGroup);

            const pSpeed = 6.5; // P波 (km/s)
            const sSpeed = 3.5; // S波 (km/s)

            function loop() {
                const elapsedSec = (Date.now() - originTimeMs) / 1000;

                if (elapsedSec >= 0 && elapsedSec <= 180) { // 3分間リアルタイム波形追跡
                    const pDistKm = Math.max(0, Math.sqrt(Math.pow(pSpeed * elapsedSec, 2) - Math.pow(depthKm, 2)) || 0);
                    const sDistKm = Math.max(0, Math.sqrt(Math.pow(sSpeed * elapsedSec, 2) - Math.pow(depthKm, 2)) || 0);

                    pCircle.setRadius(pDistKm * 1000);
                    sCircle.setRadius(sDistKm * 1000);

                    const timerEl = document.getElementById('wave-elapsed-val');
                    if (timerEl) timerEl.textContent = `${elapsedSec.toFixed(1)}秒`;

                    animationFrameId = requestAnimationFrame(loop);
                }
            }
            loop();
        }

        // --- 画面表示の一括更新 ---
        function updateDisplay(index = 0) {
            currentViewingIndex = index;
            const data = earthquakeList[index];

            document.getElementById('btn-live-reset').style.display = (index === 0) ? 'none' : 'block';
            if (!data) return;

            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            activeLayersGroup.clearLayers();
            renderHistoryList();

            const isEEW = data.code === 556;
            const hypo = isEEW ? (data.hypothesis || {}) : (data.earthquake?.hypocenter || {});
            const scaleVal = isEEW ? hypo.maxScale : data.earthquake?.maxScale;
            const originTimeStr = isEEW ? data.time : (data.earthquake?.time || data.time);
            const originTimeMs = originTimeStr ? new Date(originTimeStr).getTime() : Date.now();

            document.getElementById('earthquake-main-view').innerHTML = `
                <div class="eq-detail-card">
                    <div style="font-size: 11px; color: ${isEEW ? 'var(--accent-red)' : '#94a3b8'}; font-weight:800; margin-bottom: 4px;">
                        ${isEEW ? '🚨 緊急地震速報 (即時検知)' : (originTimeStr ? new Date(originTimeStr).toLocaleString('ja-JP') : '発生時刻不明')}
                    </div>
                    <div class="eq-location">${hypo.name || '震源地解析中'}</div>
                    <div class="eq-metrics-grid">
                        <div class="metric-box">
                            <div class="metric-label">最大震度</div>
                            <div class="metric-val" style="color:${getScaleHEX(scaleVal)}">${parseScale(scaleVal)}</div>
                        </div>
                        <div class="metric-box">
                            <div class="metric-label">規模</div>
                            <div class="metric-val">M${hypo.magnitude > 0 ? hypo.magnitude : '?'}</div>
                        </div>
                        <div class="metric-box">
                            <div class="metric-label">深さ</div>
                            <div class="metric-val">${hypo.depth >= 0 ? hypo.depth + 'km' : '不明'}</div>
                        </div>
                    </div>
                    <div class="wave-timer-box">
                        <span>地震波到達シミュレーション</span>
                        <span id="wave-elapsed-val" style="font-family:var(--font-mono);">0.0秒</span>
                    </div>
                </div>
            `;

            if (isValidCoordinate(hypo.latitude, hypo.longitude)) {
                // 震央マーカー
                const icon = L.divIcon({ className: 'epicenter-marker', html: '<div class="epicenter-cross">✖</div>' });
                L.marker([hypo.latitude, hypo.longitude], { icon }).addTo(activeLayersGroup);
                map.flyTo([hypo.latitude, hypo.longitude], 6.5, { duration: 0.8 });

                // P波・S波リアルタイム波形円の描画開始
                startRealtimeWavePropagation(hypo.latitude, hypo.longitude, originTimeMs, hypo.depth || 10);
            }

            // 面的な震度分布（色塗り描画）実行
            if (data.points && data.points.length > 0) {
                renderShadedIntensityMesh(data.points);
            }
        }

        function renderHistoryList() {
            const listEl = document.getElementById('history-scroll-list');
            listEl.innerHTML = '';

            earthquakeList.forEach((item, idx) => {
                const isEEW = item.code === 556;
                const hypo = isEEW ? (item.hypothesis || {}) : (item.earthquake?.hypocenter || {});
                const scaleVal = isEEW ? hypo.maxScale : item.earthquake?.maxScale;

                const card = document.createElement('div');
                card.className = `history-card ${idx === currentViewingIndex ? 'active' : ''}`;
                card.onclick = () => updateDisplay(idx);

                card.innerHTML = `
                    <div class="scale-badge" style="background:${getScaleHEX(scaleVal)};">${parseScale(scaleVal)}</div>
                    <div style="font-weight:700; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${hypo.name || '震源解析中'}</div>
                    <div style="font-size:10px; color:#64748b; font-family:var(--font-mono);">${isEEW ? '速報' : '確定'}</div>
                `;
                listEl.appendChild(card);
            });
        }

        // --- WebSocketリアルタイム受信処理 ---
        function connectWebSocket() {
            if (wsInstance) wsInstance.close();

            const statusDot = document.getElementById('live-indicator');
            const statusText = document.getElementById('live-status-text');
            const liveBanner = document.getElementById('live-banner');

            wsInstance = new WebSocket('wss://api-realtime-front.p2pquake.net/v2/ws');

            wsInstance.onopen = () => {
                reconnectAttempts = 0;
                statusDot.classList.remove('offline');
                statusText.textContent = "リアルタイム同期中";

                // 30秒Ping (タイムアウト切断防止)
                clearInterval(heartbeatTimer);
                heartbeatTimer = setInterval(() => {
                    if (wsInstance?.readyState === WebSocket.OPEN) {
                        wsInstance.send(JSON.stringify({ ping: true }));
                    }
                }, 30000);
            };

            wsInstance.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);

                    if (msg.code === 551 || msg.code === 556) {
                        const existIdx = earthquakeList.findIndex(e => e.id === msg.id);
                        if (existIdx !== -1) {
                            earthquakeList[existIdx] = msg;
                        } else {
                            earthquakeList.unshift(msg);
                            if (earthquakeList.length > 30) earthquakeList.pop();
                        }

                        liveBanner.style.display = 'block';
                        setTimeout(() => { liveBanner.style.display = 'none'; }, 2000);

                        // 最新情報(index 0)へ自動即時更新
                        updateDisplay(0);
                    }
                } catch (e) {
                    console.error("受信データ解析エラー", e);
                }
            };

            wsInstance.onclose = () => {
                statusDot.classList.add('offline');
                clearInterval(heartbeatTimer);

                // 指数バックオフ再接続 (安全設計)
                reconnectAttempts++;
                const delay = Math.min(60000, Math.pow(2, reconnectAttempts) * 1500);
                statusText.textContent = `切断 (${Math.round(delay/1000)}秒後再接続)`;
                setTimeout(connectWebSocket, delay);
            };

            wsInstance.onerror = () => wsInstance.close();
        }

        async function fetchInitialData() {
            try {
                const res = await fetch('https://api.p2pquake.net/v2/history?codes=551&limit=15');
                const data = await res.json();
                if (data && data.length > 0) {
                    earthquakeList = data;
                    updateDisplay(0);
                }
            } catch (e) {
                console.error("初期データの読み込み失敗", e);
            }
        }

        window.onload = () => {
            fetchInitialData();
            connectWebSocket();
        };
    </script>
</body>
</html>
