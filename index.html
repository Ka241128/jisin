<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リアルタイム地震モニター [極限動作版]</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #111; overflow: hidden; font-family: sans-serif; }
        
        /* 地図を確実にフルスクリーンにする */
        #map { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; background: #000; }
        
        /* 地図のダークモード化（通信エラーが起きない最も安定した標準OSMを使用し、色だけ反転） */
        .leaflet-layer, .leaflet-control-zoom-in, .leaflet-control-zoom-out, .leaflet-control-attribution {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }

        #ui-panel {
            position: absolute; top: 10px; left: 10px; z-index: 1000;
            width: 320px; max-width: 90vw;
            background: rgba(15, 15, 15, 0.95);
            border: 1px solid #333; border-radius: 8px;
            color: #fff; box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            display: flex; flex-direction: column;
        }

        .header {
            padding: 10px; background: #222; border-bottom: 1px solid #444;
            display: flex; justify-content: space-between; align-items: center; border-radius: 8px 8px 0 0;
        }
        .header-title { font-size: 14px; font-weight: bold; color: #00e5ff; }
        .status { font-size: 12px; font-weight: bold; padding: 3px 8px; border-radius: 4px; background: #444; }
        .status.ok { background: #006622; color: #00ff88; }
        .status.warn { background: #664400; color: #ffaa00; }
        .status.err { background: #660000; color: #ff4444; }

        .main-info { padding: 15px; }
        .eq-time { font-size: 12px; color: #aaa; margin-bottom: 5px; }
        .eq-name { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
        .metrics { display: flex; gap: 10px; }
        .metric { flex: 1; background: #222; padding: 8px; border-radius: 6px; text-align: center; }
        .m-label { font-size: 10px; color: #888; }
        .m-val { font-size: 16px; font-weight: bold; margin-top: 2px; }

        .history { border-top: 1px solid #333; max-height: 200px; overflow-y: auto; }
        .list-item { 
            padding: 8px 10px; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 10px; cursor: pointer; 
        }
        .list-item:hover { background: #2a2a2a; }
        .list-item.active { background: rgba(0, 229, 255, 0.2); border-left: 3px solid #00e5ff; }
        .shindo-badge { width: 36px; text-align: center; font-weight: bold; padding: 2px 0; border-radius: 4px; color: #000; font-size: 12px; }

        /* 震源地アイコン */
        .epicenter {
            background: none; border: none;
            color: #ff0055; font-size: 24px; font-weight: bold;
            text-shadow: 0 0 10px #ff0055, 0 0 5px #fff;
            display: flex; justify-content: center; align-items: center;
            animation: blink 1s infinite alternate;
        }
        @keyframes blink { from { transform: scale(0.8); opacity: 0.8; } to { transform: scale(1.2); opacity: 1; } }

        /* 波紋アニメーション */
        .wave { stroke: #ff0055; stroke-width: 2; fill: rgba(255,0,85,0.1); pointer-events: none; }
    </style>
</head>
<body>

    <div id="map"></div>
    <div id="ui-panel">
        <div class="header">
            <div class="header-title">地震モニター</div>
            <div id="status-badge" class="status warn">起動中...</div>
        </div>
        <div class="main-info" id="main-view">
            <div style="text-align:center; color:#888; padding:20px 0;">データを取得しています...</div>
        </div>
        <div class="history" id="history-view"></div>
    </div>

    <script>
        // ----------------------------------------------------
        // 1. 地図の初期化（絶対に表示される標準OSMを使用）
        // ----------------------------------------------------
        const map = L.map('map', { zoomControl: false }).setView([38.0, 137.0], 5);
        
        // 複数のタイルサーバーを用意（メインが死んだらサブに切り替え）
        const primaryTile = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 });
        const fallbackTile = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', { maxZoom: 18 });
        
        primaryTile.on('tileerror', () => {
            console.warn("メイン地図の読込失敗。サブ地図に切り替えます。");
            map.removeLayer(primaryTile);
            fallbackTile.addTo(map);
        });
        primaryTile.addTo(map);

        const markersLayer = L.layerGroup().addTo(map);
        let animationTimer = null;

        // ----------------------------------------------------
        // 2. データ管理とUI描画
        // ----------------------------------------------------
        let eqList = [];
        let currentIndex = 0;

        function getShindoColor(scale) {
            if (scale >= 65) return "#e600ff"; // 7
            if (scale >= 60) return "#b40000"; // 6強
            if (scale >= 55) return "#ff0055"; // 6弱
            if (scale >= 50) return "#ff5500"; // 5強
            if (scale >= 45) return "#ff9900"; // 5弱
            if (scale >= 40) return "#ffff00"; // 4
            if (scale >= 30) return "#00ff00"; // 3
            if (scale >= 20) return "#00ccff"; // 2
            if (scale >= 10) return "#cccccc"; // 1
            return "#777777";
        }
        function getShindoText(scale) {
            const m = {10:"1", 20:"2", 30:"3", 40:"4", 45:"5弱", 50:"5強", 55:"6弱", 60:"6強", 70:"7"};
            return m[scale] || "?";
        }

        function updateUI() {
            const main = document.getElementById('main-view');
            const hist = document.getElementById('history-view');
            
            if (eqList.length === 0) {
                main.innerHTML = `<div style="text-align:center; color:#888; padding:20px 0;">履歴がありません</div>`;
                hist.innerHTML = '';
                return;
            }

            // メイン情報の更新
            const eq = eqList[currentIndex];
            main.innerHTML = `
                <div class="eq-time">${eq.time}</div>
                <div class="eq-name">${eq.name}</div>
                <div class="metrics">
                    <div class="metric"><div class="m-label">最大震度</div>
                    <div class="m-val" style="color:${getShindoColor(eq.maxScale)}">${getShindoText(eq.maxScale)}</div></div>
                    <div class="metric"><div class="m-label">規模</div><div class="m-val">${eq.mag}</div></div>
                    <div class="metric"><div class="m-label">深さ</div><div class="m-val">${eq.depth}</div></div>
                </div>
            `;

            // 履歴リストの更新
            hist.innerHTML = eqList.map((e, i) => `
                <div class="list-item ${i === currentIndex ? 'active' : ''}" onclick="selectEq(${i})">
                    <div class="shindo-badge" style="background:${getShindoColor(e.maxScale)}">${getShindoText(e.maxScale)}</div>
                    <div style="flex:1; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${e.name}</div>
                </div>
            `).join('');

            // 地図の更新
            markersLayer.clearLayers();
            if (animationTimer) cancelAnimationFrame(animationTimer);

            if (eq.lat && eq.lng) {
                // 震央マーカー
                const icon = L.divIcon({ className: 'epicenter', html: '✕', iconSize: [30, 30] });
                L.marker([eq.lat, eq.lng], { icon: icon }).addTo(markersLayer);
                map.setView([eq.lat, eq.lng], 6);

                // 波紋アニメーション
                const wave = L.circle([eq.lat, eq.lng], { className: 'wave', radius: 0 }).addTo(markersLayer);
                let radius = 0;
                function drawWave() {
                    radius += 2000; // 広がるスピード
                    if (radius > 400000) radius = 0;
                    wave.setRadius(radius);
                    animationTimer = requestAnimationFrame(drawWave);
                }
                drawWave();
            }
        }

        window.selectEq = function(index) {
            currentIndex = index;
            updateUI();
        };

        // ----------------------------------------------------
        // 3. 絶対に止まらない通信モジュール（フェイルセーフ設計）
        // ----------------------------------------------------
        const badge = document.getElementById('status-badge');
        function setStatus(state, msg) {
            badge.className = `status ${state}`;
            badge.textContent = msg;
        }

        // データを解析・重複排除してリストに追加する処理
        function processData(rawDataArray) {
            let updated = false;
            rawDataArray.forEach(data => {
                if (data.code !== 551) return; // 震度情報のみ
                const eq = data.earthquake || {};
                const hypo = eq.hypocenter || {};
                const id = data.id || data.time;
                
                // 重複チェック
                if (eqList.some(e => e.id === id)) return;
                
                eqList.push({
                    id: id,
                    time: eq.time || data.time || "時刻不明",
                    name: hypo.name || "名称不明",
                    lat: hypo.latitude > 0 ? hypo.latitude : null,
                    lng: hypo.longitude > 0 ? hypo.longitude : null,
                    mag: hypo.magnitude ? `M${hypo.magnitude.toFixed(1)}` : "-",
                    depth: hypo.depth ? `${hypo.depth}km` : "-",
                    maxScale: eq.maxScale || -1
                });
                updated = true;
            });

            if (updated) {
                // 新しい順に並び替え
                eqList.sort((a, b) => new Date(b.time) - new Date(a.time));
                eqList = eqList.slice(0, 20); // 最新20件を保持
                updateUI();
            }
        }

        // HTTPポーリング（WebSocketが死んだ時の命綱）
        let httpTimer = null;
        async function fetchHTTP() {
            try {
                // 5秒で強制タイムアウトさせる（永遠に待たない）
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);
                
                const res = await fetch('https://api.p2pquake.net/v2/history?codes=551&limit=10', { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!res.ok) throw new Error("APIエラー");
                const json = await res.json();
                processData(json);
                return true;
            } catch (err) {
                console.error("HTTP通信失敗:", err);
                return false;
            }
        }

        // WebSocketの管理
        let ws = null;
        function connectWS() {
            if (ws) ws.close();
            
            try {
                ws = new WebSocket('wss://api.p2pquake.net/v2/ws');
                
                ws.onopen = () => {
                    setStatus('ok', '● リアルタイム接続中');
                    // WSが繋がったらHTTPポーリングは停止
                    if (httpTimer) clearInterval(httpTimer);
                };
                
                ws.onmessage = (e) => {
                    try {
                        const data = JSON.parse(e.data);
                        processData([data]);
                    } catch (err) {}
                };
                
                ws.onclose = ws.onerror = () => {
                    setStatus('err', '通信切断 - 復旧中...');
                    // WSが切れたら即座にHTTPポーリング（5秒間隔）を開始してデータを逃さない
                    if (!httpTimer) {
                        fetchHTTP();
                        httpTimer = setInterval(fetchHTTP, 5000);
                    }
                    // 10秒後にWS再接続を試みる
                    setTimeout(connectWS, 10000);
                };
            } catch (err) {
                // セキュリティ制限等でWS自体が作れない場合もHTTPポーリングへ
                if (!httpTimer) {
                    setStatus('warn', '● HTTPバックアップモード');
                    fetchHTTP();
                    httpTimer = setInterval(fetchHTTP, 5000);
                }
            }
        }

        // ----------------------------------------------------
        // 4. 起動シーケンス
        // ----------------------------------------------------
        async function boot() {
            setStatus('warn', 'データ取得中...');
            const success = await fetchHTTP();
            if (!success) {
                setStatus('err', '初期データ取得失敗。再試行します。');
                // 失敗しても諦めず3秒後に再試行
                setTimeout(boot, 3000);
                return;
            }
            connectWS();
        }

        // ページが表示・復帰した時に強制的にデータを最新化
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                fetchHTTP();
                if (!ws || ws.readyState !== WebSocket.OPEN) {
                    connectWS();
                }
            }
        });

        // 実行開始
        boot();

    </script>
</body>
</html>
