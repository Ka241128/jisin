<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMART QUAKE VIEWER NEXT GEN v5 β2 (Enhanced)</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

    <style>
        :root {
            --glass-base: rgba(12, 14, 28, 0.75);
            --glass-border: rgba(255, 255, 255, 0.12);
            --neon-blue: #3b82f6;
            --neon-red: #ff4757;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #020204; color: #fff; overflow: hidden; }
        
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; background-color: #050508; }
        .leaflet-layer { filter: invert(100%) hue-rotate(180deg) brightness(45%) contrast(120%); }
        .leaflet-top.leaflet-right { top: 20px !important; right: 20px !important; }

        /* アニメーション付きマーカー */
        .epicenter-icon {
            display: flex; justify-content: center; align-items: center;
            color: #ff4757; font-size: 22px; font-weight: 900; text-shadow: 0 0 8px #ff4757;
            animation: pulse-epicenter 1.2s infinite ease-in-out;
        }
        @keyframes pulse-epicenter {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* パネル制御 */
        #info-container { 
            position: absolute; z-index: 1005; display: flex; flex-direction: column; 
            pointer-events: none; top: 20px; left: 20px; width: 380px; max-width: calc(100vw - 40px);
            transition: opacity 0.3s ease;
        }
        
        #info-overlay { 
            background: var(--glass-base); backdrop-filter: blur(25px) saturate(180%); -webkit-backdrop-filter: blur(25px) saturate(180%);
            padding: 20px; border-radius: 20px; border: 1px solid var(--glass-border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6); pointer-events: auto; display: flex; flex-direction: column; gap: 12px;
            max-height: 80vh; overflow: hidden; transition: opacity 0.3s;
        }
        #info-overlay.transparent-mode { opacity: 0.25; }

        #panel-header {
            display: flex; justify-content: space-between; align-items: center;
            cursor: move; user-select: none; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .panel-title { font-size: 11px; font-weight: 700; color: #94a3b8; letter-spacing: 0.1em; }
        
        #status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
        #status-indicator { color: #4ade80; display: flex; align-items: center; gap: 6px; font-weight: 600; }
        .pulse-dot { width: 8px; height: 8px; background-color: #4ade80; border-radius: 50%; box-shadow: 0 0 8px #4ade80; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        
        #current-clock { color: #fff; font-weight: 700; font-variant-numeric: tabular-nums; background: rgba(255,255,255,0.08); padding: 2px 8px; border-radius: 6px; }

        /* 地震詳細情報カード */
        .eq-card { background: rgba(255,255,255,0.03); border-radius: 14px; padding: 14px; border: 1px solid rgba(255,255,255,0.05); }
        .eq-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .tsunami-badge { font-size: 10px; padding: 3px 8px; border-radius: 6px; font-weight: bold; }
        .tsunami-none { background: rgba(255,255,255,0.1); color: #cbd5e1; }
        .tsunami-warn { background: #e11d48; color: #fff; box-shadow: 0 0 10px rgba(225,29,72,0.5); }

        .eq-place { font-size: 22px; font-weight: 800; margin: 4px 0 10px 0; letter-spacing: -0.02em; color: #f8fafc; }
        .eq-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px; color: #94a3b8; }
        .eq-grid-item span { display: block; font-size: 10px; color: #64748b; margin-bottom: 2px; }
        .scale-highlight { color: #ff6b6b; font-weight: 900; font-size: 20px; }

        /* 履歴リスト */
        #history-list { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; max-height: 220px; padding-right: 4px; }
        #history-list::-webkit-scrollbar { width: 4px; }
        #history-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

        .history-item { 
            display: grid; grid-template-columns: 50px 1fr auto; align-items: center; gap: 10px; 
            font-size: 12px; color: #cbd5e1; background: rgba(255, 255, 255, 0.02); padding: 10px 12px; 
            border-radius: 10px; cursor: pointer; border: 1px solid transparent; transition: all 0.2s ease; 
        }
        .history-item:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255,255,255,0.1); }
        .history-item.active { background: rgba(59, 130, 246, 0.15); border-color: rgba(59, 130, 246, 0.4); }

        .history-scale { 
            font-weight: 800; padding: 4px; border-radius: 6px; text-align: center; font-size: 11px; color: #000;
        }

        /* モーダル & アラート */
        #beta-modal, #eew-alert { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10000; display: flex; justify-content: center; align-items: center; }
        #beta-modal { background: rgba(4, 4, 8, 0.8); backdrop-filter: blur(15px); }
        .beta-box { background: rgba(15, 16, 32, 0.9); padding: 28px; border-radius: 18px; border: 1px solid rgba(59, 130, 246, 0.3); max-width: 360px; text-align: center; }
        .beta-btn { background: var(--neon-blue); border: none; color: #fff; padding: 10px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 15px; width: 100%; }

        @media (max-width: 767px) {
            #info-container { top: auto; bottom: 15px; left: 15px; width: calc(100vw - 30px); }
            #history-list { max-height: 160px; }
        }
    </style>
</head>
<body>

    <div id="beta-modal" onclick="closeBetaModal()">
        <div class="beta-box" onclick="event.stopPropagation()">
            <div style="font-size:12px; font-weight:700; color:var(--neon-blue); margin-bottom:8px;">SYSTEM NOTICE</div>
            <p style="font-size:15px; font-weight:bold; margin:0 0 10px 0;">SMART QUAKE VIEWER NEXT</p>
            <p style="font-size:12px; color:#94a3b8; margin:0;">本システムはβ版です。<br>情報の精度や更新頻度は保証されません。</p>
            <button class="beta-btn" onclick="closeBetaModal()">利用を開始する</button>
        </div>
    </div>

    <div id="map"></div>
    
    <div id="info-container">
        <div id="info-overlay">
            <div id="panel-header" onmousedown="startDrag(event)" ontouchstart="startDrag(event)">
                <span class="panel-title">地震情報パネル（ドラッグで移動）</span>
                <span style="font-size:12px; opacity:0.6;">⋮⋮</span>
            </div>

            <div id="status-bar">
                <div id="status-indicator"><div class="pulse-dot"></div> LIVE (1.5s)</div>
                <div id="current-clock">00:00:00</div>
            </div>
            
            <div id="eq-content">
                <div class="eq-card">
                    <p style="margin:0; font-size:12px; color:#64748b; text-align:center;">データを読み込み中...</p>
                </div>
            </div>

            <div style="font-size:10px; font-weight:700; color:#64748b; margin-top:4px;">履歴一覧</div>
            <div id="history-list"></div>
        </div>
    </div>

    <script>
        function closeBetaModal() {
            const modal = document.getElementById('beta-modal');
            if (modal) modal.style.display = 'none';
        }

        const japanBounds = [[20.0, 118.0], [47.0, 155.0]];
        let map = L.map('map', { zoomControl: false, maxBounds: japanBounds, maxBoundsViscosity: 1.0, minZoom: 4, maxZoom: 10 }).setView([36.2048, 138.2529], 5);
        
        L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/blank/{z}/{x}/{y}.png', {
            attribution: '&copy; 国土地理院'
        }).addTo(map);
        L.control.zoom({ position: 'topright' }).addTo(map);

        let dynamicMappingGroup = L.layerGroup().addTo(map);
        let mixedDataList = [];
        let selectedIndex = -1;

        function updateClock() {
            const now = new Date();
            document.getElementById('current-clock').textContent = 
                `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
        }
        setInterval(updateClock, 1000); 
        updateClock();

        function parseScale(s) {
            const sc = {10:"1", 20:"2", 30:"3", 40:"4", 45:"5弱", 50:"5強", 55:"6弱", 60:"6強", 70:"7"};
            return sc[s] || "不明";
        }

        function getScaleBgColor(scale) {
            if (scale >= 60) return "#d63031";
            if (scale >= 50) return "#ff7675";
            if (scale >= 40) return "#e17055";
            if (scale >= 30) return "#fdcb6e";
            if (scale >= 20) return "#74b9ff";
            return "#00b894";
        }

        function selectData(index) {
            selectedIndex = index;
            const item = mixedDataList[index];
            if (!item) return;

            renderHistoryList();
            dynamicMappingGroup.clearLayers();

            const info = item.earthquake?.hypocenter || {};
            const timeStr = item.earthquake?.time ? new Date(item.earthquake.time).toLocaleString('ja-JP') : '不明';

            // 情報パネルの更新
            document.getElementById('eq-content').innerHTML = `
                <div class="eq-card">
                    <div class="eq-title-row">
                        <span style="font-size:11px; color:#94a3b8;">${timeStr}</span>
                        <span class="tsunami-badge tsunami-none">津波の心配なし</span>
                    </div>
                    <div class="eq-place">${info.name || '震源情報なし'}</div>
                    <div class="eq-grid">
                        <div class="eq-grid-item">
                            <span>最大震度</span>
                            <span class="scale-highlight" style="color:${getScaleBgColor(item.earthquake?.maxScale)}">
                                ${parseScale(item.earthquake?.maxScale)}
                            </span>
                        </div>
                        <div class="eq-grid-item">
                            <span>マグニチュード</span>
                            <strong style="color:#f1f5f9; font-size:16px;">M${info.magnitude > 0 ? info.magnitude : '?'}</strong>
                        </div>
                        <div class="eq-grid-item">
                            <span>深さ</span>
                            <strong style="color:#f1f5f9;">${info.depth > 0 ? info.depth + 'km' : '不明'}</strong>
                        </div>
                    </div>
                </div>
            `;

            // 地図上の震央マーカー描画
            if (info.latitude && info.latitude !== -1) {
                const epicenterIcon = L.divIcon({
                    className: 'epicenter-icon',
                    html: '✖',
                    iconSize: [30, 30],
                    iconAnchor: [15, 15]
                });

                L.marker([info.latitude, info.longitude], { icon: epicenterIcon }).addTo(dynamicMappingGroup);

                // カメラの視点移動
                map.flyTo([info.latitude, info.longitude], 6, { duration: 1.2 });
            }
        }

        function renderHistoryList() {
            const listContainer = document.getElementById('history-list');
            listContainer.innerHTML = '';

            mixedDataList.forEach((item, idx) => {
                const info = item.earthquake?.hypocenter || {};
                const scaleStr = parseScale(item.earthquake?.maxScale);
                const scaleColor = getScaleBgColor(item.earthquake?.maxScale);
                const timeStr = item.earthquake?.time ? new Date(item.earthquake.time).toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'}) : '';

                const div = document.createElement('div');
                div.className = `history-item ${idx === selectedIndex ? 'active' : ''}`;
                div.onclick = () => selectData(idx);
                div.innerHTML = `
                    <div class="history-scale" style="background:${scaleColor};">震度${scaleStr}</div>
                    <div style="font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${info.name || '震源地不明'}</div>
                    <div style="font-size:10px; color:#64748b;">${timeStr}</div>
                `;
                listContainer.appendChild(div);
            });
        }

        // デモデータ読み込み（サンプル動作確認用）
        function loadDemoData() {
            mixedDataList = [
                {
                    earthquake: {
                        time: "2026-10-03T14:30:00",
                        maxScale: 40,
                        hypocenter: { name: "千葉県東方沖", magnitude: 4.8, depth: 40, latitude: 35.6, longitude: 140.8 }
                    }
                },
                {
                    earthquake: {
                        time: "2026-10-03T11:15:00",
                        maxScale: 30,
                        hypocenter: { name: "石川県能登地方", magnitude: 3.9, depth: 10, latitude: 37.3, longitude: 136.9 }
                    }
                }
            ];
            selectData(0);
        }

        // パネルドラッグ機能
        let isDragging = false, startX, startY, initialX, initialY;
        const container = document.getElementById('info-container');

        function startDrag(e) {
            isDragging = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            startX = clientX - container.offsetLeft;
            startY = clientY - container.offsetTop;

            document.addEventListener('mousemove', drag);
            document.addEventListener('touchmove', drag, { passive: false });
            document.addEventListener('mouseup', stopDrag);
            document.addEventListener('touchend', stopDrag);
        }

        function drag(e) {
            if (!isDragging) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            container.style.left = `${clientX - startX}px`;
            container.style.top = `${clientY - startY}px`;
            if (e.cancelable) e.preventDefault();
        }

        function stopDrag() {
            isDragging = false;
            document.removeEventListener('mousemove', drag);
            document.removeEventListener('touchmove', drag);
        }

        window.onload = loadDemoData;
    </script>
</body>
</html>
