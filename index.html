<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リアルタイム地震モニター [イラストマップ版]</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #0a0a0f; overflow: hidden; font-family: -apple-system, sans-serif; }
        
        #map { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; background: #0a0a0f; }

        /* 国土地理院の白地図を「完全にシンプルな線画イラスト風」に変換するCSS */
        .leaflet-tile {
            filter: grayscale(100%) invert(100%) contrast(400%) brightness(80%);
        }

        /* コンパクトなUIパネル */
        #ui-panel {
            position: absolute; top: 12px; left: 12px; z-index: 1000;
            width: 240px; max-width: calc(100vw - 24px);
            background: rgba(15, 15, 20, 0.92);
            border: 1px solid #333; border-radius: 6px;
            color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            display: flex; flex-direction: column;
        }

        .header {
            padding: 8px 10px; background: #18181c; border-bottom: 1px solid #333;
            display: flex; justify-content: space-between; align-items: center; border-radius: 6px 6px 0 0;
        }
        .header-title { font-size: 11px; font-weight: 800; color: #00e5ff; letter-spacing: 0.5px; }
        .status { font-size: 9px; font-weight: bold; padding: 2px 6px; border-radius: 4px; background: #333; color: #aaa; }
        .status.ok { background: rgba(0, 255, 136, 0.15); color: #00ff88; border: 1px solid #00ff88; }
        .status.demo { background: rgba(255, 170, 0, 0.15); color: #ffaa00; border: 1px solid #ffaa00; }

        .main-info { padding: 10px 12px; }
        .eq-time { font-size: 10px; color: #888; margin-bottom: 2px; font-family: monospace; }
        .eq-name { font-size: 14px; font-weight: 900; margin-bottom: 8px; }
        .metrics { display: flex; gap: 6px; }
        .metric { flex: 1; background: #222; padding: 5px 2px; border-radius: 4px; text-align: center; border: 1px solid #333; }
        .m-label { font-size: 8px; color: #777; margin-bottom: 2px; }
        .m-val { font-size: 13px; font-weight: 900; font-family: monospace; }

        .history { border-top: 1px solid #2a2a2a; max-height: 140px; overflow-y: auto; }
        .list-item { 
            padding: 6px 8px; border-bottom: 1px solid #1f1f1f; display: flex; align-items: center; gap: 8px; cursor: pointer; 
        }
        .list-item:hover { background: #222; }
        .list-item.active { background: rgba(0, 229, 255, 0.12); border-left: 3px solid #00e5ff; }
        .shindo-badge { width: 30px; text-align: center; font-weight: 900; padding: 2px 0; border-radius: 3px; color: #000; font-size: 10px; font-family: monospace; }
    </style>
</head>
<body>

    <div id="map"></div>
    <div id="ui-panel">
        <div class="header">
            <div class="header-title">地震モニター</div>
            <div id="status-badge" class="status demo">準備中</div>
        </div>
        <div class="main-info" id="main-view"></div>
        <div class="history" id="history-view"></div>
    </div>

    <script>
        // 1. 国土地理院の白地図（海岸線・境界線のみのイラスト風マップ）
        const map = L.map('map', { zoomControl: false }).setView([38.0, 137.0], 5);
        
        L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/blank/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" style="color:#555;">国土地理院白地図</a>'
        }).addTo(map);

        const markersLayer = L.layerGroup().addTo(map);
        let animationTimer = null;

        let eqList = [];
        let currentIndex = 0;

        // 初期データ（過去データ扱いのため isLive: false -> 円は絶対に出ず「×」のみ）
        const initialData = [
            { id: 'd1', isEEW: true, isLive: false, time: '2026/03/30 14:15', name: '千葉県東方沖 (速報)', lat: 35.6, lng: 140.7, mag: 'M5.2', depth: '30km', maxScale: -2 },
            { id: 'd2', isEEW: false, isLive: false, time: '2026/03/30 12:00', name: '石川県能登地方', lat: 37.5, lng: 137.2, mag: 'M4.1', depth: '10km', maxScale: 30 },
            { id: 'd3', isEEW: false, isLive: false, time: '2026/03/29 22:40', name: 'トカラ列島近海', lat: 29.4, lng: 129.5, mag: 'M3.8', depth: '20km', maxScale: 20 }
        ];

        function getShindoColor(scale) {
            if (scale === -2) return "#ff0055"; // EEW
            if (scale >= 65) return "#e600ff";
            if (scale >= 60) return "#b40000";
            if (scale >= 55) return "#ff0055";
            if (scale >= 50) return "#ff5500";
            if (scale >= 45) return "#ff9900";
            if (scale >= 40) return "#ffff00";
            if (scale >= 30) return "#00ff00";
            if (scale >= 20) return "#00ccff";
            if (scale >= 10) return "#cccccc";
            return "#666666";
        }

        function getShindoText(scale) {
            if (scale === -2) return "EEW";
            const m = {10:"1", 20:"2", 30:"3", 40:"4", 45:"5弱", 50:"5強", 55:"6弱", 60:"6強", 70:"7"};
            return m[scale] || "?";
        }

        function updateUI() {
            const main = document.getElementById('main-view');
            const hist = document.getElementById('history-view');
            
            if (eqList.length === 0) return;

            const eq = eqList[currentIndex];
            
            main.innerHTML = `
                <div class="eq-time">${eq.time}</div>
                <div class="eq-name" style="color: ${eq.isEEW ? '#ff4444' : '#fff'}">${eq.name}</div>
                <div class="metrics">
                    <div class="metric"><div class="m-label">${eq.isEEW ? '種別' : '最大震度'}</div>
                    <div class="m-val" style="color:${getShindoColor(eq.maxScale)}">${getShindoText(eq.maxScale)}</div></div>
                    <div class="metric"><div class="m-label">規模</div><div class="m-val">${eq.mag}</div></div>
                    <div class="metric"><div class="m-label">深さ</div><div class="m-val">${eq.depth}</div></div>
                </div>
            `;

            hist.innerHTML = eqList.map((e, i) => `
                <div class="list-item ${i === currentIndex ? 'active' : ''}" onclick="selectEq(${i})">
                    <div class="shindo-badge" style="background:${getShindoColor(e.maxScale)}">${getShindoText(e.maxScale)}</div>
                    <div style="flex:1; font-size:11px; font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color: ${e.isEEW ? '#ff4444' : '#fff'}">${e.name}</div>
                </div>
            `).join('');

            // アニメーションのリセット
            markersLayer.clearLayers();
            if (animationTimer) {
                cancelAnimationFrame(animationTimer);
                animationTimer = null;
            }

            if (eq.lat && eq.lng) {
                // 赤い「×」マーク（SVGで確実に描画）
                const crossSVG = `
                    <div style="display:flex; justify-content:center; align-items:center; width:100%; height:100%;">
                        <svg width="24" height="24" viewBox="0 0 24 24" stroke="#ff0055" stroke-width="4" stroke-linecap="round">
                            <line x1="4" y1="4" x2="20" y2="20"/>
                            <line x1="20" y1="4" x2="4" y2="20"/>
                        </svg>
                    </div>
                `;
                const icon = L.divIcon({ className: '', html: crossSVG, iconSize: [24, 24], iconAnchor: [12, 12] });
                L.marker([eq.lat, eq.lng], { icon: icon }).addTo(markersLayer);
                
                map.setView([eq.lat, eq.lng], 6);

                // 【波紋の条件】「リアルタイム発生中 (isLive === true)」かつ「緊急地震速報 (isEEW)」かつ「最新表示 (currentIndex === 0)」の時のみ！
                if (eq.isEEW && eq.isLive && currentIndex === 0) {
                    const pWave = L.circle([eq.lat, eq.lng], { color: '#00aaff', weight: 2, fill: false, interactive: false }).addTo(markersLayer);
                    const sWave = L.circle([eq.lat, eq.lng], { color: '#ff0055', weight: 2, fillColor: '#ff0055', fillOpacity: 0.15, interactive: false }).addTo(markersLayer);
                    
                    let pRadius = 0;
                    let sRadius = 0;
                    
                    function drawWave() {
                        pRadius += 4000; // P波
                        sRadius += 2000; // S波
                        
                        if (pRadius > 500000) {
                            pRadius = 0;
                            sRadius = 0;
                        }
                        
                        pWave.setRadius(pRadius);
                        sWave.setRadius(sRadius);
                        animationTimer = requestAnimationFrame(drawWave);
                    }
                    drawWave();
                }
            }
        }

        window.selectEq = function(index) {
            currentIndex = index;
            updateUI();
        };

        const badge = document.getElementById('status-badge');
        function setStatus(state, msg) {
            badge.className = `status ${state}`;
            badge.textContent = msg;
        }

        function processData(rawDataArray, isRealtimeReceived = false) {
            let updated = false;
            rawDataArray.forEach(data => {
                if (data.code !== 551 && data.code !== 556) return;
                
                const id = data.id || data.time;
                if (eqList.some(e => e.id === id)) return;
                
                const eq = data.earthquake || {};
                const hypo = eq.hypocenter || {};
                
                if (data.code === 551) {
                    eqList.push({
                        id: id,
                        isEEW: false,
                        isLive: false, // 通常地震は円なし
                        time: eq.time || data.time || "時刻不明",
                        name: hypo.name || "名称不明",
                        lat: hypo.latitude > 0 ? hypo.latitude : null,
                        lng: hypo.longitude > 0 ? hypo.longitude : null,
                        mag: hypo.magnitude > 0 ? `M${hypo.magnitude.toFixed(1)}` : "-",
                        depth: hypo.depth >= 0 ? `${hypo.depth}km` : "-",
                        maxScale: eq.maxScale || -1
                    });
                    updated = true;
                } else if (data.code === 556) {
                    // リアルタイム通信で今届いたEEWのみ isLive = true にする
                    const isLiveEvent = isRealtimeReceived;
                    
                    const newItem = {
                        id: id,
                        isEEW: true,
                        isLive: isLiveEvent,
                        time: data.time || "時刻不明",
                        name: (hypo.name || "不明") + " (速報)",
                        lat: hypo.latitude > 0 ? hypo.latitude : null,
                        lng: hypo.longitude > 0 ? hypo.longitude : null,
                        mag: hypo.magnitude > 0 ? `M${hypo.magnitude.toFixed(1)}` : "-",
                        depth: hypo.depth >= 0 ? `${hypo.depth}km` : "-",
                        maxScale: -2
                    };

                    eqList.push(newItem);
                    updated = true;

                    // リアルタイム発生中の波紋は90秒後に自動消滅して「×」のみにする
                    if (isLiveEvent) {
                        setTimeout(() => {
                            newItem.isLive = false;
                            updateUI();
                        }, 90000);
                    }
                }
            });

            if (updated) {
                // サンプルデータを削除して最新データに置換
                eqList = eqList.filter(e => !e.id.startsWith('d'));
                eqList.sort((a, b) => new Date(b.time) - new Date(a.time));
                eqList = eqList.slice(0, 15);
                currentIndex = 0; 
                updateUI();
            }
        }

        async function tryFetchAPI() {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3000);
                const res = await fetch('https://api.p2pquake.net/v2/history?codes=551,556&limit=10', { signal: controller.signal });
                clearTimeout(timeoutId);

                if (res.ok) {
                    const json = await res.json();
                    // 履歴データとして取得したものは発生中ではないため isRealtimeReceived = false
                    processData(json, false);
                    setStatus('ok', '● リアルタイム');
                    return true;
                }
            } catch (e) {}
            return false;
        }

        function initWebSocket() {
            try {
                const ws = new WebSocket('wss://api.p2pquake.net/v2/ws');
                ws.onopen = () => setStatus('ok', '● リアルタイム');
                ws.onmessage = (e) => {
                    try { 
                        // リアルタイム通信（WebSocket）で今届いた情報のみ isRealtimeReceived = true
                        processData([JSON.parse(e.data)], true); 
                    } catch (err) {}
                };
            } catch (e) {}
        }

        function boot() {
            // 初期画面（すべて isLive: false のため円は一切出ず×マークのみ）
            eqList = [...initialData];
            setStatus('demo', '● 接続確認中');
            updateUI();

            tryFetchAPI().then(success => {
                if (!success) setStatus('demo', '● オフライン表示');
            });
            initWebSocket();

            setInterval(tryFetchAPI, 15000);
        }

        boot();
    </script>
</body>
</html>
