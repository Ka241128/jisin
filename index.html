<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMART QUAKE VIEWER PRO</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

    <style>
        :root {
            --bg-dark: #07090e;
            --panel-bg: rgba(10, 14, 23, 0.88);
            --border-color: rgba(255, 255, 255, 0.12);
            --accent-blue: #00d2ff;
            --accent-red: #ff0055;
            --font-mono: 'JetBrains Mono', 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg-dark); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: #f1f5f9; }

        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; background: #030407; }

        /* Leafletのダークスタイルカスタム */
        .leaflet-tile { filter: brightness(0.6) invert(100%) contrast(3) hue-rotate(200deg) saturate(0.3); }
        .leaflet-container { background: #030407 !important; }
        .leaflet-control-zoom { border: 1px solid var(--border-color) !important; background: var(--panel-bg) !important; backdrop-filter: blur(10px); }
        .leaflet-control-zoom-in, .leaflet-control-zoom-out { background: transparent !important; color: #fff !important; border-bottom-color: var(--border-color) !important; }

        /* P波・S波リアルタイム波形円 */
        .wave-p { stroke: #00d2ff; stroke-width: 2; fill: rgba(0, 210, 255, 0.08); stroke-dasharray: 4 4; }
        .wave-s { stroke: #ff0055; stroke-width: 2.5; fill: rgba(255, 0, 85, 0.15); }

        /* 震央アニメーションアイコン */
        .epicenter-marker {
            display: flex; justify-content: center; align-items: center;
            width: 32px; height: 32px;
        }
        .epicenter-cross {
            position: absolute; font-size: 26px; font-weight: 900; color: #ff0055;
            text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055;
            animation: pulse-cross 0.8s infinite alternate ease-in-out;
        }
        @keyframes pulse-cross {
            from { transform: scale(0.9); opacity: 0.8; }
            to { transform: scale(1.3); opacity: 1; }
        }

        /* メインUIコンテナ */
        #ui-container {
            position: absolute; top: 16px; left: 16px; z-index: 1000;
            width: 380px; max-width: calc(100vw - 32px); pointer-events: none;
        }

        .glass-panel {
            background: var(--panel-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color); border-radius: 16px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8); pointer-events: auto;
            overflow: hidden; display: flex; flex-direction: column; transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .panel-header {
            padding: 14px 18px; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
            cursor: move; user-select: none; background: rgba(255, 255, 255, 0.02);
        }
        .brand-title { font-size: 11px; font-weight: 800; letter-spacing: 0.15em; color: var(--accent-blue); text-transform: uppercase; }

        .status-strip {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 18px; font-size: 11px; background: rgba(0, 0, 0, 0.3); border-bottom: 1px solid var(--border-color);
        }
        .status-badge { display: flex; align-items: center; gap: 6px; font-weight: 700; }
        .dot-live { width: 8px; height: 8px; border-radius: 50%; background: #00ff88; box-shadow: 0 0 8px #00ff88; animation: pulse-live 1.2s infinite; }
        .dot-live.offline { background: #ff4757; box-shadow: 0 0 8px #ff4757; }
        @keyframes pulse-live { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .clock-display { font-family: var(--font-mono); font-weight: 700; color: #94a3b8; }

        /* 地震詳細ビュー */
        .eq-detail-card { padding: 18px; }
        .eq-time-line { font-size: 12px; color: #94a3b8; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .tsunami-status { font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 4px; background: rgba(255,255,255,0.1); }
        .tsunami-status.alert { background: var(--accent-red); color: #fff; box-shadow: 0 0 10px rgba(255,0,85,0.5); }

        .eq-location { font-size: 24px; font-weight: 900; color: #fff; margin-bottom: 12px; letter-spacing: -0.02em; line-height: 1.2; }

        .eq-metrics-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .metric-box { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); padding: 8px 10px; border-radius: 10px; }
        .metric-label { font-size: 9px; color: #64748b; font-weight: 700; text-transform: uppercase; margin-bottom: 2px; }
        .metric-val { font-size: 16px; font-weight: 800; color: #f8fafc; font-family: var(--font-mono); }
        .metric-val.scale { font-size: 20px; font-weight: 900; }

        /* 履歴リスト */
        .list-header-title { font-size: 10px; font-weight: 800; color: #64748b; padding: 10px 18px 4px 18px; text-transform: uppercase; letter-spacing: 0.05em; }
        #history-scroll-list { max-height: 220px; overflow-y: auto; padding: 0 12px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
        #history-scroll-list::-webkit-scrollbar { width: 4px; }
        #history-scroll-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

        .history-card {
            display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 10px;
            padding: 8px 12px; background: rgba(255, 255, 255, 0.02); border: 1px solid transparent;
            border-radius: 10px; cursor: pointer; transition: all 0.15s ease;
        }
        .history-card:hover { background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.1); }
        .history-card.selected { background: rgba(0, 210, 255, 0.12); border-color: rgba(0, 210, 255, 0.4); }
        .history-card.is-eew { background: rgba(255, 0, 85, 0.12); border-color: rgba(255, 0, 85, 0.4); }

        .scale-badge {
            font-size: 11px; font-weight: 900; text-align: center; padding: 4px 0; border-radius: 6px;
            color: #000; font-family: var(--font-mono);
        }

        /* 全面緊急地震速報 (EEW) オーバーレイ */
        #eew-fullscreen-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 99999;
            background: rgba(180, 0, 40, 0.94); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 20px; box-sizing: border-box; cursor: pointer;
            animation: eew-flash 0.5s infinite alternate ease-in-out;
        }
        @keyframes eew-flash {
            from { background: rgba(200, 0, 50, 0.92); }
            to { background: rgba(100, 0, 20, 0.98); }
        }

        .eew-alert-tag { background: #fff; color: #d00030; font-weight: 900; font-size: 14px; padding: 4px 16px; border-radius: 20px; letter-spacing: 0.1em; margin-bottom: 12px; }
        .eew-main-title { font-size: max(6vw, 36px); font-weight: 900; letter-spacing: 0.05em; text-shadow: 0 4px 30px rgba(0,0,0,0.8); margin-bottom: 8px; }
        .eew-sub-title { font-size: max(2.5vw, 18px); font-weight: 700; color: #ffea00; text-shadow: 0 2px 10px rgba(0,0,0,0.5); margin-bottom: 24px; }
        .eew-info-box { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.2); padding: 20px 30px; border-radius: 16px; max-width: 600px; width: 100%; }

        @media (max-width: 767px) {
            #ui-container { top: auto; bottom: 16px; left: 16px; width: calc(100vw - 32px); }
            #history-scroll-list { max-height: 150px; }
        }
    </style>
</head>
<body>

    <!-- 全面EEW割り込みスクリーン -->
    <div id="eew-fullscreen-overlay" onclick="dismissEEW()">
        <span id="eew-type-label" class="eew-alert-tag">緊急地震速報</span>
        <h1 class="eew-main-title">🚨 強い揺れに警戒 🚨</h1>
        <p class="eew-sub-title">倒壊や落下物に警戒し身の安全を確保してください</p>
        <div class="eew-info-box">
            <div id="eew-epicenter-name" style="font-size: 26px; font-weight: 900; margin-bottom: 8px;">震源地: 解析中...</div>
            <div id="eew-magnitude-scale" style="font-size: 18px; color: #f1f5f9; font-family: var(--font-mono);">最大予想震度: -- / M--</div>
        </div>
        <div style="margin-top: 24px; font-size: 12px; opacity: 0.8;">画面タップで閉じます</div>
    </div>

    <div id="map"></div>

    <!-- メイン操作パネル -->
    <div id="ui-container">
        <div class="glass-panel">
            <div class="panel-header" onmousedown="initPanelDrag(event)" ontouchstart="initPanelDrag(event)">
                <span class="brand-title">SMART QUAKE PRO</span>
                <span style="font-size: 12px; color: #64748b;">⋮⋮</span>
            </div>

            <div class="status-strip">
                <div class="status-badge">
                    <div id="live-indicator" class="dot-live"></div>
                    <span id="live-status-text">リアルタイム同期中</span>
                </div>
                <div id="live-clock" class="clock-display">00:00:00</div>
            </div>

            <div id="earthquake-main-view">
                <div class="eq-detail-card">
                    <div style="text-align: center; font-size: 12px; color: #64748b;">データ接続中...</div>
                </div>
            </div>

            <div class="list-header-title">受信履歴</div>
            <div id="history-scroll-list"></div>
        </div>
    </div>

    <script>
        // --- 画面・マップ初期化 ---
        const japanCenter = [36.2048, 138.2529];
        const map = L.map('map', { zoomControl: false, minZoom: 4, maxZoom: 11 }).setView(japanCenter, 5);

        // 高解像度ダークタイルの追加
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            subdomains: 'abcd', maxZoom: 19, attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        const activeLayersGroup = L.layerGroup().addTo(map);

        // --- グローバル状態管理 ---
        let earthquakeList = [];
        let activeSelectionIndex = -1;
        let waveAnimationTimer = null;
        let activeEEWEvent = null;

        // --- リアルタイム時計 ---
        function updateClock() {
            const now = new Date();
            document.getElementById('live-clock').textContent =
                `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
        }
        setInterval(updateClock, 1000); updateClock();

        // --- 震度変換＆配色ロジック (気象庁準拠) ---
        function parseJMAOptionScale(scale) {
            if (scale === undefined || scale === null || scale < 0) return "不明";
            const map = { 10: "1", 20: "2", 30: "3", 40: "4", 45: "5弱", 50: "5強", 55: "6弱", 60: "6強", 70: "7" };
            return map[scale] || "不明";
        }

        function getJMACityColor(scale) {
            if (scale >= 60) return "#d63031"; // 6強・7 (赤黒)
            if (scale >= 50) return "#ff7675"; // 5強・6弱 (赤)
            if (scale >= 40) return "#ff7675"; // 5弱 (橙)
            if (scale >= 30) return "#fdcb6e"; // 3・4 (黄)
            if (scale >= 20) return "#74b9ff"; // 2 (青)
            if (scale >= 10) return "#00b894"; // 1 (緑)
            return "#636e72";
        }

        // --- 詳細カード描画 ---
        function selectEarthquakeItem(index) {
            activeSelectionIndex = index;
            const data = earthquakeList[index];
            if (!data) return;

            renderHistoryList();
            clearMapLayers();

            const isEEW = data.code === 556 || data.isEEW;

            if (isEEW) {
                // EEWの詳細表示
                const hypo = data.hypothesis || {};
                document.getElementById('earthquake-main-view').innerHTML = `
                    <div class="eq-detail-card" style="background: rgba(255, 0, 85, 0.05);">
                        <div class="eq-time-line">
                            <span style="color: var(--accent-red); font-weight:800;">🚨 緊急地震速報 (${data.eewType === 'warning' ? '警報' : '予報'})</span>
                            <span class="tsunami-status alert">即時警戒</span>
                        </div>
                        <div class="eq-location">${hypo.name || '震源解析中...'}</div>
                        <div class="eq-metrics-grid">
                            <div class="metric-box">
                                <div class="metric-label">最大予想震度</div>
                                <div class="metric-val scale" style="color:${getJMACityColor(hypo.maxScale)}">${parseJMAOptionScale(hypo.maxScale)}</div>
                            </div>
                            <div class="metric-box">
                                <div class="metric-label">マグニチュード</div>
                                <div class="metric-val">M${hypo.magnitude || '?'}</div>
                            </div>
                            <div class="metric-box">
                                <div class="metric-label">予想深さ</div>
                                <div class="metric-val">${hypo.depth ? hypo.depth + 'km' : '不明'}</div>
                            </div>
                        </div>
                    </div>
                `;

                if (hypo.latitude && hypo.longitude) {
                    plotEpicenter(hypo.latitude, hypo.longitude);
                    startWavePropagationSimulation(hypo.latitude, hypo.longitude, data.time || new Date().toISOString(), hypo.depth || 10);
                }
            } else {
                // 通常地震情報(551)の詳細表示
                const hypo = data.earthquake?.hypocenter || {};
                const timeText = data.earthquake?.time ? new Date(data.earthquake.time).toLocaleString('ja-JP') : '不明';

                document.getElementById('earthquake-main-view').innerHTML = `
                    <div class="eq-detail-card">
                        <div class="eq-time-line">
                            <span>${timeText} 発生</span>
                            <span class="tsunami-status ${data.earthquake?.domesticTsunami !== 'None' ? 'alert' : ''}">
                                津波: ${data.earthquake?.domesticTsunami === 'None' ? 'なし' : '調査・警戒中'}
                            </span>
                        </div>
                        <div class="eq-location">${hypo.name || '震源地情報なし'}</div>
                        <div class="eq-metrics-grid">
                            <div class="metric-box">
                                <div class="metric-label">最大震度</div>
                                <div class="metric-val scale" style="color:${getJMACityColor(data.earthquake?.maxScale)}">${parseJMAOptionScale(data.earthquake?.maxScale)}</div>
                            </div>
                            <div class="metric-box">
                                <div class="metric-label">規模</div>
                                <div class="metric-val">M${hypo.magnitude > 0 ? hypo.magnitude : '?'}</div>
                            </div>
                            <div class="metric-box">
                                <div class="metric-label">震源の深さ</div>
                                <div class="metric-val">${hypo.depth >= 0 ? hypo.depth + 'km' : '不明'}</div>
                            </div>
                        </div>
                    </div>
                `;

                if (hypo.latitude && hypo.longitude) {
                    plotEpicenter(hypo.latitude, hypo.longitude);
                }

                // 各観測点のプロット描画
                if (data.points && data.points.length > 0) {
                    data.points.forEach(pt => {
                        if (pt.latitude && pt.longitude) {
                            L.circleMarker([pt.latitude, pt.longitude], {
                                radius: Math.max(3, (pt.scale / 10) * 2.2),
                                fillColor: getJMACityColor(pt.scale),
                                color: "#ffffff",
                                weight: 0.8,
                                fillOpacity: 0.85
                            }).bindPopup(`<b>${pt.addr}</b><br>震度: ${parseJMAOptionScale(pt.scale)}`).addTo(activeLayersGroup);
                        }
                    });
                }
            }
        }

        // --- P波・S波リアルタイム波形伝播シミュレーション ---
        function startWavePropagationSimulation(lat, lng, originTimeStr, depthKm) {
            const originTime = new Date(originTimeStr).getTime();
            const pSpeed = 6.5; // P波平均速度 (km/s)
            const sSpeed = 3.5; // S波平均速度 (km/s)

            const pCircle = L.circle([lat, lng], { className: 'wave-p', radius: 100 }).addTo(activeLayersGroup);
            const sCircle = L.circle([lat, lng], { className: 'wave-s', radius: 100 }).addTo(activeLayersGroup);

            if (waveAnimationTimer) clearInterval(waveAnimationTimer);

            waveAnimationTimer = setInterval(() => {
                const elapsedSec = (Date.now() - originTime) / 1000;
                if (elapsedSec < 0 || elapsedSec > 300) { // 5分以上経過したら自動停止
                    clearInterval(waveAnimationTimer);
                    return;
                }

                // 走時曲線簡易計算 (地表距離)
                const pDistKm = Math.max(0, Math.sqrt(Math.pow(pSpeed * elapsedSec, 2) - Math.pow(depthKm, 2)) || 0);
                const sDistKm = Math.max(0, Math.sqrt(Math.pow(sSpeed * elapsedSec, 2) - Math.pow(depthKm, 2)) || 0);

                pCircle.setRadius(pDistKm * 1000);
                sCircle.setRadius(sDistKm * 1000);
            }, 100);
        }

        function plotEpicenter(lat, lng) {
            const icon = L.divIcon({
                className: 'epicenter-marker',
                html: '<div class="epicenter-cross">✖</div>',
                iconSize: [32, 32],
                iconAnchor: [16, 16]
            });
            L.marker([lat, lng], { icon: icon }).addTo(activeLayersGroup);
            map.flyTo([lat, lng], 6.5, { duration: 1.2 });
        }

        function clearMapLayers() {
            if (waveAnimationTimer) clearInterval(waveAnimationTimer);
            activeLayersGroup.clearLayers();
        }

        // --- 履歴リストの描画 ---
        function renderHistoryList() {
            const listEl = document.getElementById('history-scroll-list');
            listEl.innerHTML = '';

            earthquakeList.forEach((item, idx) => {
                const isEEW = item.code === 556 || item.isEEW;
                const hypo = isEEW ? (item.hypothesis || {}) : (item.earthquake?.hypocenter || {});
                const scaleVal = isEEW ? (hypo.maxScale || -1) : (item.earthquake?.maxScale || -1);

                const rawTime = isEEW ? item.time : (item.earthquake?.time || item.time);
                const timeText = rawTime ? new Date(rawTime).toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'}) : '';

                const card = document.createElement('div');
                card.className = `history-card ${idx === activeSelectionIndex ? 'selected' : ''} ${isEEW ? 'is-eew' : ''}`;
                card.onclick = () => selectEarthquakeItem(idx);

                card.innerHTML = `
                    <div class="scale-badge" style="background:${getJMACityColor(scaleVal)};">
                        ${isEEW ? '速報' : '震度' + parseJMAOptionScale(scaleVal)}
                    </div>
                    <div style="font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px;">
                        ${hypo.name || '震源解析中'}
                    </div>
                    <div style="font-size:10px; color:#64748b; font-family:var(--font-mono);">${timeText}</div>
                `;
                listEl.appendChild(card);
            });
        }

        // --- 全面EEW画面のトリガー ---
        function triggerEEWFullscreenAlert(eewData) {
            activeEEWEvent = eewData;
            const overlay = document.getElementById('eew-fullscreen-overlay');
            const typeLabel = document.getElementById('eew-type-label');
            const epiText = document.getElementById('eew-epicenter-name');
            const magText = document.getElementById('eew-magnitude-scale');

            const hypo = eewData.hypothesis || {};
            const isWarning = eewData.eewType === 'warning' || eewData.isWarning;

            typeLabel.textContent = isWarning ? "緊急地震速報 (警報)" : "緊急地震速報 (予報)";
            epiText.textContent = `震源地: ${hypo.name || '解析中...'}`;
            magText.textContent = `最大予想震度: ${parseJMAOptionScale(hypo.maxScale)} / M${hypo.magnitude || '?'}`;

            overlay.style.display = 'flex';
        }

        function dismissEEW() {
            document.getElementById('eew-fullscreen-overlay').style.display = 'none';
        }

        // --- P2P地震情報 REST APIより初期データ取得 ---
        async function loadInitialData() {
            try {
                const res = await fetch('https://api.p2pquake.net/v2/history?codes=551&limit=20');
                const data = await res.json();
                if (data && data.length > 0) {
                    earthquakeList = data;
                    selectEarthquakeItem(0);
                }
            } catch (e) {
                console.error("初期データの読み込みに失敗しました:", e);
            }
        }

        // --- P2P地震情報 WebSocket リアルタイム通信メイン処理 ---
        function connectWebSocket() {
            const statusDot = document.getElementById('live-indicator');
            const statusText = document.getElementById('live-status-text');

            const ws = new WebSocket('wss://api-realtime-front.p2pquake.net/v2/ws');

            ws.onopen = () => {
                statusDot.classList.remove('offline');
                statusText.textContent = "リアルタイム同期中";
            };

            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);

                    // 551: 地震情報, 556: 緊急地震速報
                    if (msg.code === 551 || msg.code === 556) {
                        const existingIdx = earthquakeList.findIndex(item => item.id === msg.id);

                        if (existingIdx !== -1) {
                            earthquakeList[existingIdx] = msg;
                        } else {
                            earthquakeList.unshift(msg);
                            if (earthquakeList.length > 40) earthquakeList.pop();
                        }

                        if (msg.code === 556) {
                            triggerEEWFullscreenAlert(msg);
                        }

                        selectEarthquakeItem(0);
                    }
                } catch (err) {
                    console.error("受信データの解析エラー:", err);
                }
            };

            ws.onclose = () => {
                statusDot.classList.add('offline');
                statusText.textContent = "切断 (自動再接続中)";
                setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = () => { ws.close(); };
        }

        // --- パネルドラッグ処理 ---
        let isDragging = false, startX, startY;
        const container = document.getElementById('ui-container');

        function initPanelDrag(e) {
            isDragging = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            startX = clientX - container.offsetLeft;
            startY = clientY - container.offsetTop;

            document.addEventListener('mousemove', handlePanelMove);
            document.addEventListener('touchmove', handlePanelMove, { passive: false });
            document.addEventListener('mouseup', stopPanelDrag);
            document.addEventListener('touchend', stopPanelDrag);
        }

        function handlePanelMove(e) {
            if (!isDragging) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            container.style.left = `${clientX - startX}px`;
            container.style.top = `${clientY - startY}px`;
            if (e.cancelable) e.preventDefault();
        }

        function stopPanelDrag() {
            isDragging = false;
            document.removeEventListener('mousemove', handlePanelMove);
            document.removeEventListener('touchmove', handlePanelMove);
        }

        // --- 起動 ---
        window.onload = () => {
            loadInitialData();
            connectWebSocket();
        };
    </script>
</body>
</html>
