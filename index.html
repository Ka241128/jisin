<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リアルタイム地震モニター [国土地理院・安定版]</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: -apple-system, sans-serif; }
        
        #map { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; background: #05080c; }
        
        /* 国土地理院の淡色地図をダークモードに反転して視認性を高める */
        .leaflet-layer {
            filter: invert(100%) hue-rotate(180deg) brightness(80%) contrast(120%);
        }

        #ui-panel {
            position: absolute; top: 12px; left: 12px; z-index: 1000;
            width: 320px; max-width: calc(100vw - 24px);
            background: rgba(15, 15, 18, 0.95);
            border: 1px solid #333; border-radius: 8px;
            color: #fff; box-shadow: 0 4px 20px rgba(0,0,0,0.9);
            display: flex; flex-direction: column;
        }

        .header {
            padding: 10px 12px; background: #1a1a1a; border-bottom: 1px solid #333;
            display: flex; justify-content: space-between; align-items: center; border-radius: 8px 8px 0 0;
        }
        .header-title { font-size: 14px; font-weight: 800; color: #00e5ff; }
        .status { font-size: 11px; font-weight: bold; padding: 4px 8px; border-radius: 4px; background: #444; }
        .status.ok { background: rgba(0, 255, 136, 0.15); color: #00ff88; border: 1px solid #00ff88; }
        .status.warn { background: rgba(255, 170, 0, 0.15); color: #ffaa00; border: 1px solid #ffaa00; }
        .status.err { background: rgba(255, 68, 68, 0.15); color: #ff4444; border: 1px solid #ff4444; }

        .main-info { padding: 15px; }
        .eq-time { font-size: 11px; color: #aaa; margin-bottom: 4px; font-family: monospace; }
        .eq-name { font-size: 18px; font-weight: 900; margin-bottom: 12px; }
        .metrics { display: flex; gap: 8px; }
        .metric { flex: 1; background: #222; padding: 10px 4px; border-radius: 6px; text-align: center; border: 1px solid #333; }
        .m-label { font-size: 10px; color: #888; margin-bottom: 4px; }
        .m-val { font-size: 16px; font-weight: 900; font-family: monospace; }

        .history { border-top: 1px solid #333; max-height: 200px; overflow-y: auto; }
        .list-item { 
            padding: 10px; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 12px; cursor: pointer; 
        }
        .list-item:hover { background: #2a2a2a; }
        .list-item.active { background: rgba(0, 229, 255, 0.1); border-left: 3px solid #00e5ff; }
        .shindo-badge { width: 40px; text-align: center; font-weight: 900; padding: 4px 0; border-radius: 4px; color: #000; font-size: 12px; font-family: monospace; }

        .epicenter {
            display: flex; justify-content: center; align-items: center;
            color: #ff0055; font-size: 28px; font-weight: 900;
            text-shadow: 0 0 12px #ff0055, 0 0 4px #fff;
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse { from { transform: scale(0.8); opacity: 0.8; } to { transform: scale(1.3); opacity: 1; } }

        .wave { stroke: #ff0055; stroke-width: 2.5; fill: rgba(255,0,85,0.08); pointer-events: none; }
    </style>
</head>
<body>

    <div id="map"></div>
    <div id="ui-panel">
        <div class="header">
            <div class="header-title">地震モニター LIVE</div>
            <div id="status-badge" class="status warn">起動中...</div>
        </div>
        <div class="main-info" id="main-view">
            <div style="text-align:center; color:#888; padding:20px 0;">気象庁データを同期中...</div>
        </div>
        <div class="history" id="history-view"></div>
    </div>

    <script>
        // ----------------------------------------------------
        // 1. 地図：日本政府・国土地理院（GSI）の公式タイルを使用（APIキー絶対不要）
        // ----------------------------------------------------
        const map = L.map('map', { zoomControl: false }).setView([38.0, 137.0], 5);
        
        L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: "<a href='https://maps.gsi.go.jp/development/ichiran.html' target='_blank' style='color:#888;'>国土地理院</a>"
        }).addTo(map);

        const markersLayer = L.layerGroup().addTo(map);
        let animationTimer = null;

        // ----------------------------------------------------
        // 2. データ処理とUI描画
        // ----------------------------------------------------
        let eqList = [];
        let currentIndex = 0;

        function getShindoColor(scale) {
            if (scale >= 65) return "#e600ff"; // 7
            if (scale >= 60) return "#b40000"; // 6強
            if (scale >= 55) return "#ff0055"; // 6弱
            if (scale >= 50) return "#ff5500"; // 5強
            if (scale >= 45) return "#ff9900"; // 5弱
            if (scale >= 40) return "#ffff00"; // 4
            if (scale >= 30) return "#00ff00"; // 3
            if (scale >= 20) return "#00ccff"; // 2
            if (scale >= 10) return "#cccccc"; // 1
            return "#666666";
        }

        function getShindoText(scale) {
            const m = {10:"1", 20:"2", 30:"3", 40:"4", 45:"5弱", 50:"5強", 55:"6弱", 60:"6強", 70:"7"};
            return m[scale] || "?";
        }

        function updateUI() {
            const main = document.getElementById('main-view');
            const hist = document.getElementById('history-view');
            
            if (eqList.length === 0) return;

            const eq = eqList[currentIndex];
            main.innerHTML = `
                <div class="eq-time">${eq.time}</div>
                <div class="eq-name">${eq.name}</div>
                <div class="metrics">
                    <div class="metric"><div class="m-label">最大震度</div>
                    <div class="m-val" style="color:${getShindoColor(eq.maxScale)}">${getShindoText(eq.maxScale)}</div></div>
                    <div class="metric"><div class="m-label">規模</div><div class="m-val">${eq.mag}</div></div>
                    <div class="metric"><div class="m-label">深さ</div><div class="m-val">${eq.depth}</div></div>
                </div>
            `;

            hist.innerHTML = eqList.map((e, i) => `
                <div class="list-item ${i === currentIndex ? 'active' : ''}" onclick="selectEq(${i})">
                    <div class="shindo-badge" style="background:${getShindoColor(e.maxScale)}">${getShindoText(e.maxScale)}</div>
                    <div style="flex:1; font-size:13px; font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${e.name}</div>
                </div>
            `).join('');

            markersLayer.clearLayers();
            if (animationTimer) cancelAnimationFrame(animationTimer);

            if (eq.lat && eq.lng) {
                const icon = L.divIcon({ className: 'epicenter', html: '✕', iconSize: [30, 30] });
                L.marker([eq.lat, eq.lng], { icon: icon }).addTo(markersLayer);
                map.setView([eq.lat, eq.lng], 6);

                const wave = L.circle([eq.lat, eq.lng], { className: 'wave', radius: 0 }).addTo(markersLayer);
                let radius = 0;
                function drawWave() {
                    radius += 2000;
                    if (radius > 400000) radius = 0;
                    wave.setRadius(radius);
                    animationTimer = requestAnimationFrame(drawWave);
                }
                drawWave();
            }
        }

        window.selectEq = function(index) {
            currentIndex = index;
            updateUI();
        };

        // ----------------------------------------------------
        // 3. 通信モジュール
        // ----------------------------------------------------
        const badge = document.getElementById('status-badge');
        function setStatus(state, msg) {
            badge.className = `status ${state}`;
            badge.textContent = msg;
        }

        function processData(rawDataArray) {
            let updated = false;
            rawDataArray.forEach(data => {
                if (data.code !== 551) return;
                const eq = data.earthquake || {};
                const hypo = eq.hypocenter || {};
                const id = data.id || data.time;
                
                if (eqList.some(e => e.id === id)) return;
                
                eqList.push({
                    id: id,
                    time: eq.time || data.time || "時刻不明",
                    name: hypo.name || "名称不明",
                    lat: hypo.latitude > 0 ? hypo.latitude : null,
                    lng: hypo.longitude > 0 ? hypo.longitude : null,
                    mag: hypo.magnitude > 0 ? `M${hypo.magnitude.toFixed(1)}` : "-",
                    depth: hypo.depth >= 0 ? `${hypo.depth}km` : "-",
                    maxScale: eq.maxScale || -1
                });
                updated = true;
            });

            if (updated) {
                eqList.sort((a, b) => new Date(b.time) - new Date(a.time));
                eqList = eqList.slice(0, 20);
                updateUI();
            }
        }

        let httpTimer = null;
        async function fetchHTTP() {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);
                
                const res = await fetch('https://api.p2pquake.net/v2/history?codes=551&limit=10', { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!res.ok) throw new Error("APIレスポンスエラー");
                const json = await res.json();
                processData(json);
                return true;
            } catch (err) {
                return false;
            }
        }

        let ws = null;
        function connectWS() {
            if (ws) ws.close();
            
            try {
                ws = new WebSocket('wss://api.p2pquake.net/v2/ws');
                
                ws.onopen = () => {
                    setStatus('ok', '● リアルタイム受信中');
                    if (httpTimer) { clearInterval(httpTimer); httpTimer = null; }
                };
                
                ws.onmessage = (e) => {
                    try { processData([JSON.parse(e.data)]); } catch (err) {}
                };
                
                ws.onclose = ws.onerror = () => {
                    setStatus('err', '切断 - バックアップ通信中');
                    if (!httpTimer) {
                        fetchHTTP();
                        httpTimer = setInterval(fetchHTTP, 5000);
                    }
                    setTimeout(connectWS, 10000);
                };
            } catch (err) {
                if (!httpTimer) {
                    setStatus('warn', '● HTTPバックアップ通信');
                    fetchHTTP();
                    httpTimer = setInterval(fetchHTTP, 5000);
                }
            }
        }

        async function boot() {
            setStatus('warn', '気象庁データ接続中...');
            const success = await fetchHTTP();
            if (!success) {
                setStatus('err', '接続エラー。再試行します');
                setTimeout(boot, 3000);
                return;
            }
            connectWS();
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                fetchHTTP();
                if (!ws || ws.readyState !== WebSocket.OPEN) connectWS();
            }
        });

        boot();
    </script>
</body>
</html>
