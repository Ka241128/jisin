<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>リアルタイム地震モニター</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0a0a0f;overflow:hidden;font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;color:#fff}
#map{position:absolute;inset:0;background:#0a0a0f}
.leaflet-tile{filter:grayscale(100%) invert(100%) contrast(400%) brightness(80%)}
#panel{position:absolute;top:12px;left:12px;z-index:1000;width:290px;max-width:calc(100vw - 24px);max-height:calc(100% - 24px);display:flex;flex-direction:column;background:rgba(15,15,20,.94);border:1px solid #333;border-radius:8px;box-shadow:0 4px 15px rgba(0,0,0,.8)}
.head{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#18181c;border-bottom:1px solid #333;border-radius:8px 8px 0 0}
.title{flex:1;font-size:12px;font-weight:800;color:#00e5ff}
.status{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;background:#333;color:#aaa;white-space:nowrap}
.status.ok{color:#0f8;border:1px solid #0f8;background:rgba(0,255,136,.12)}
.status.warn{color:#fa0;border:1px solid #fa0;background:rgba(255,170,0,.12)}
button{font:inherit;background:#222;color:#ddd;border:1px solid #3a3a3a;border-radius:5px;font-size:11px;padding:5px 9px;cursor:pointer;min-height:28px}
button.on{background:rgba(0,229,255,.18);border-color:#00e5ff;color:#00e5ff}
.tools{display:flex;gap:6px;padding:6px 10px;border-bottom:1px solid #2a2a2a}
.upd{padding:4px 12px;font-size:10px;color:#888;font-family:monospace;border-bottom:1px solid #2a2a2a}
.diag{margin-top:2px;font-size:9px;color:#fa0;word-break:break-all;font-family:-apple-system,sans-serif}
.main{padding:10px 12px}
.t{font-size:10px;color:#888;font-family:monospace;margin-bottom:2px}
.name{font-size:15px;font-weight:900;margin-bottom:8px}
.metrics{display:flex;gap:6px}
.m{flex:1;background:#222;border:1px solid #333;border-radius:4px;text-align:center;padding:5px 2px}
.m i{display:block;font-style:normal;font-size:9px;color:#888;margin-bottom:2px}
.m b{font-size:14px;font-family:monospace}
.note{font-size:10px;margin-top:7px;color:#aaa}
.note.alert{color:#fa0}
.msg{padding:16px 12px;font-size:12px;color:#aaa;text-align:center;line-height:1.6}
.hist{flex:1;min-height:0;overflow-y:auto;border-top:1px solid #2a2a2a}
.item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-bottom:1px solid #1f1f1f;cursor:pointer}
.item:hover{background:#222}
.item.active{background:rgba(0,229,255,.12);box-shadow:inset 3px 0 #00e5ff}
.badge{flex:none;width:36px;text-align:center;font:900 10px monospace;padding:3px 0;border-radius:3px;color:#000}
.iname{flex:1;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.itime{flex:none;font-size:9px;color:#888}
.legend{display:flex;gap:2px;padding:6px 10px;border-top:1px solid #2a2a2a}
.legend span{flex:1;text-align:center;font-size:8px;font-weight:900;color:#000;padding:2px 0;border-radius:2px}
#panel.min .main,#panel.min .hist,#panel.min .legend,#panel.min .tools,#panel.min .upd{display:none}
.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media(max-width:600px){
 #panel{top:auto;bottom:0;left:0;right:0;width:auto;max-width:none;max-height:55%;border-radius:12px 12px 0 0}
 .head{border-radius:12px 12px 0 0}
}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
 <div class="head">
  <div class="title">🌏 地震モニター</div>
  <div id="status" class="status">接続中…</div>
  <button id="btnMin" style="padding:2px 8px;min-height:22px">－</button>
 </div>
 <div class="tools">
  <button id="btnFollow" class="on">自動追従</button>
  <button id="btnSound">🔇 音</button>
  <button id="btnJapan">全国</button>
  <button id="btnReload">更新</button>
 </div>
 <div class="upd">
  <div id="upd">最終更新 --:--:--</div>
  <div class="diag" id="diag"></div>
 </div>
 <div class="main" id="main"><div class="msg">地震情報を取得しています…</div></div>
 <div class="hist" id="hist"></div>
 <div class="legend" id="legend"></div>
</div>

<script>
(function(){
'use strict';
const API_P2P_BOTH = 'https://api.p2pquake.net/v2/history?codes=551&codes=556&limit=';
const API_P2P_EQ   = 'https://api.p2pquake.net/v2/history?codes=551&limit=';
const API_JMA      = 'https://www.jma.go.jp/bosai/quake/data/list.json';
const API_WS       = 'wss://api.p2pquake.net/v2/ws';
const WAVE_SEC = 150, MAX_ITEMS = 30;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---- 地図 ---- */
if (typeof L === 'undefined') {
  $('main').innerHTML = '<div class="msg">地図ライブラリ(Leaflet)を読み込めませんでした。<br>インターネット接続を確認して再読み込みしてください。</div>';
  return;
}
const map = L.map('map', {zoomControl:false}).setView([37.5,137.5], 5);
L.control.zoom({position:'topright'}).addTo(map);
L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/blank/{z}/{x}/{y}.png', {
  maxZoom: 14, attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a> / <a href="https://www.p2pquake.net/">P2P地震情報</a> / 気象庁'
}).addTo(map);
const layer = L.layerGroup().addTo(map);

/* ---- 状態 ---- */
let events = [], selected = null, follow = true, sound = false;
let loaded = false, fetchFailed = false, wsOK = false, raf = 0, audio = null;
let src = '', errs = {}, wsErr = '', busy = false, lastTry = 0;

/* ---- 震度 ---- */
const SH = {10:['1','#cccccc'],20:['2','#00ccff'],30:['3','#00ee66'],40:['4','#ffee00'],45:['5弱','#ff9900'],46:['5弱~','#ff9900'],50:['5強','#ff5500'],55:['6弱','#ff0055'],60:['6強','#d00000'],70:['7','#e600ff']};
const shText  = s => SH[s] ? SH[s][0] : '-';
const shColor = s => s === -2 ? '#ff0055' : (SH[s] ? SH[s][1] : '#666');
$('legend').innerHTML = [10,20,30,40,45,50,55,60,70].map(s => `<span style="background:${shColor(s)}">${SH[s][0]}</span>`).join('');

/* ---- 時刻 ---- */
function parseTime(s){
  const m = String(s||'').match(/(\d{4})\/(\d{1,2})\/(\d{1,2}) (\d{1,2}):(\d{2})(?::(\d{2}))?/);
  return m ? new Date(+m[1], m[2]-1, +m[3], +m[4], +m[5], +(m[6]||0)) : new Date();
}
const p2 = n => String(n).padStart(2,'0');
const fmt = d => `${d.getMonth()+1}/${d.getDate()} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
function rel(t){
  const s = Math.max(0, Math.floor((Date.now()-t)/1000));
  return s<60 ? s+'秒前' : s<3600 ? Math.floor(s/60)+'分前' : s<86400 ? Math.floor(s/3600)+'時間前' : Math.floor(s/86400)+'日前';
}
function markUpdate(){
  const d = new Date();
  $('upd').textContent = `最終更新 ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;
}
function updateDiag(){
  const parts = Object.keys(errs).map(k => `${k}: ${errs[k]}`);
  if (wsErr) parts.push('リアルタイム接続: ' + wsErr);
  $('diag').textContent = parts.length ? '⚠ ' + parts.join(' / ') : '';
}

/* ---- データ変換 ---- */
function toEvent(d){
  if (!d || d.test) return null;
  const eq = d.earthquake || {}, hy = eq.hypocenter || {};
  const lat = hy.latitude > 0 && hy.latitude < 90 ? hy.latitude : null;
  const lng = hy.longitude > 0 && hy.longitude < 180 ? hy.longitude : null;
  const mag = hy.magnitude > 0 ? 'M' + hy.magnitude.toFixed(1) : '-';
  const depth = hy.depth === 0 ? 'ごく浅い' : hy.depth > 0 ? hy.depth + 'km' : '-';
  if (d.code === 551) {
    return {key:'q'+(d.id||d.time), eew:false, time:parseTime(eq.time||d.time), name:hy.name||'震源調査中',
            lat, lng, mag, depth, scale:eq.maxScale>0?eq.maxScale:-1, tsunami:eq.domesticTsunami||''};
  }
  if (d.code === 556) {
    let exp = -1;
    (d.areas||[]).forEach(a => { const v = (a.scaleTo>0 && a.scaleTo<99) ? a.scaleTo : a.scaleFrom; if (v > exp) exp = v; });
    return {key:'e'+((d.issue&&d.issue.eventId)||d.id), eew:true, time:parseTime(eq.originTime||eq.arrivalTime||d.time),
            name:hy.name||'震源不明', lat, lng, mag, depth, scale:-2, expected:exp, cancelled:!!d.cancelled, tsunami:''};
  }
  return null;
}
/* 気象庁 list.json を P2P 形式に変換 */
const JMA_SCALE = {'1':10,'2':20,'3':30,'4':40,'5-':45,'5+':50,'6-':55,'6+':60,'7':70};
function jmaToP2P(list){
  return list.slice(0,20).map(it => {
    const m = String(it.cod||'').match(/([+-]\d+(?:\.\d+)?)([+-]\d+(?:\.\d+)?)([+-]\d+)?/);
    return {
      code:551, id:'j'+(it.json||it.at),
      earthquake:{
        time:String(it.at||'').slice(0,19).replace(/-/g,'/').replace('T',' '),
        maxScale:JMA_SCALE[it.maxi]||-1,
        hypocenter:{
          name:it.anm||'', latitude:m?+m[1]:-200, longitude:m?+m[2]:-200,
          magnitude:parseFloat(it.mag)||-1, depth:(m&&m[3])?Math.round(-m[3]/1000):-1
        }
      }
    };
  });
}
const isLive = e => e.eew && !e.cancelled && (Date.now()-e.time)/1000 < WAVE_SEC;

function ingest(arr, realtime, poll){
  let newest = null;
  arr.forEach(d => {
    const ev = toEvent(d); if (!ev) return;
    const i = events.findIndex(x => x.key === ev.key);
    if (i < 0) { events.push(ev); if (realtime) newest = ev; }
    else { events[i] = ev; if (realtime && !poll) newest = ev; }
  });
  events.sort((a,b) => b.time - a.time);
  events = events.slice(0, MAX_ITEMS);
  loaded = true;
  let move = false;
  if (newest && follow) { selected = newest.key; move = true; }
  if (!events.some(e => e.key === selected)) { selected = events[0] && events[0].key; move = true; }
  if (newest && newest.eew && newest.lat) beep();
  render(move);
}

/* ---- 描画 ---- */
function render(moveMap){
  setStatus();
  if (!loaded) {
    $('main').innerHTML = fetchFailed
      ? '<div class="msg">地震情報を取得できません。<br>下の警告表示と通信状況を確認してください。<br>自動で再試行しています。</div>'
      : '<div class="msg">地震情報を取得しています…</div>';
    $('hist').innerHTML = ''; return;
  }
  const eq = events.find(e => e.key === selected);
  if (!eq) { $('main').innerHTML = '<div class="msg">表示できる地震情報がありません</div>'; $('hist').innerHTML = ''; return; }
  const live = isLive(eq);
  const tsu = eq.tsunami && !['None','Unknown','NonEffective','Checking'].includes(eq.tsunami);
  $('main').innerHTML = `
    <div class="t">${fmt(eq.time)} 発生 ・ <span id="rel" data-t="${+eq.time}">${rel(eq.time)}</span></div>
    <div class="name" style="color:${eq.eew?'#f55':'#fff'}">${esc(eq.name)}${eq.eew?(eq.cancelled?'（取消）':'（速報）'):''}</div>
    <div class="metrics">
      <div class="m"><i>${eq.eew?'予測震度':'最大震度'}</i><b style="color:${shColor(eq.eew?eq.expected:eq.scale)}">${shText(eq.eew?eq.expected:eq.scale)}</b></div>
      <div class="m"><i>規模</i><b>${eq.mag}</b></div>
      <div class="m"><i>深さ</i><b style="font-size:12px">${eq.depth}</b></div>
    </div>
    ${live ? '<div class="note alert">⚠ 緊急地震速報 発表中 ― 青:P波 / 赤:S波 の推定範囲</div>' : ''}
    ${tsu ? '<div class="note alert">🌊 津波に関する情報があります。気象庁の発表を確認してください</div>' : ''}
    ${eq.lat ? '' : '<div class="note">震源の位置は未確定のため地図には表示されません</div>'}`;
  $('hist').innerHTML = events.map(e => `
    <div class="item ${e.key===selected?'active':''}" data-k="${esc(e.key)}">
      <div class="badge" style="background:${shColor(e.scale)}">${e.eew?'EEW':shText(e.scale)}</div>
      <div class="iname" style="color:${e.eew?'#f77':'#fff'}">${esc(e.name)}${e.cancelled?'（取消）':''}</div>
      <div class="itime">${fmt(e.time).split(' ')[1]}</div>
    </div>`).join('');
  drawMap(eq, moveMap);
}

function drawMap(eq, moveMap){
  layer.clearLayers();
  if (raf) { cancelAnimationFrame(raf); raf = 0; }
  if (!eq.lat) return;
  const live = isLive(eq);
  const svg = `<svg width="28" height="28" viewBox="0 0 24 24" stroke="#ff0055" stroke-width="4" stroke-linecap="round" class="${live?'pulse':''}"><line x1="4" y1="4" x2="20" y2="20"/><line x1="20" y1="4" x2="4" y2="20"/></svg>`;
  L.marker([eq.lat, eq.lng], {icon:L.divIcon({className:'', html:svg, iconSize:[28,28], iconAnchor:[14,14]}), interactive:false}).addTo(layer);
  if (moveMap) map.setView([eq.lat, eq.lng], Math.max(map.getZoom(), 6));
  if (live) {
    const pw = L.circle([eq.lat, eq.lng], {radius:1, color:'#00aaff', weight:2, fill:false, interactive:false}).addTo(layer);
    const sw = L.circle([eq.lat, eq.lng], {radius:1, color:'#ff0055', weight:2, fillColor:'#ff0055', fillOpacity:.15, interactive:false}).addTo(layer);
    const tick = () => {
      const t = (Date.now() - eq.time) / 1000;
      if (t > WAVE_SEC) { render(false); return; }
      pw.setRadius(Math.max(1, t*7000));
      sw.setRadius(Math.max(1, t*4000));
      raf = requestAnimationFrame(tick);
    };
    tick();
  }
}

function setStatus(){
  const s = $('status');
  if (wsOK) { s.className = 'status ok'; s.textContent = '● リアルタイム'; }
  else if (loaded && !fetchFailed) {
    s.className = 'status warn';
    s.textContent = src === '気象庁' ? '● 気象庁データ(15秒)' : '● 定期更新(3秒)';
  }
  else { s.className = 'status warn'; s.textContent = '● 接続中…'; }
}

/* ---- 操作 ---- */
$('hist').addEventListener('click', e => {
  const it = e.target.closest('.item'); if (!it) return;
  selected = it.dataset.k; render(true);
});
$('btnFollow').onclick = function(){ follow = !follow; this.classList.toggle('on', follow); };
$('btnSound').onclick = function(){
  sound = !sound; this.classList.toggle('on', sound); this.textContent = sound ? '🔔 音' : '🔇 音';
  if (sound) { initAudio(); beep(); }
};
$('btnJapan').onclick = () => map.setView([37.5,137.5], 5);
$('btnReload').onclick = () => fetchHistory();
$('btnMin').onclick = function(){ this.textContent = $('panel').classList.toggle('min') ? '＋' : '－'; };

/* ---- 音 ---- */
function initAudio(){
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
  } catch(e) {}
}
function beep(){
  if (!sound || !audio) return;
  [0,.35,.7].forEach(t => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = 'square'; o.frequency.value = 880; g.gain.value = .08;
    o.connect(g); g.connect(audio.destination);
    o.start(audio.currentTime + t); o.stop(audio.currentTime + t + .2);
  });
}

/* ---- 通信 ---- */
async function getJSON(url){
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 8000);
  try {
    const r = await fetch(url, {signal: ctl.signal, cache:'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(to); }
}
const errText = e => e && e.name === 'AbortError' ? 'タイムアウト' : (e && e.message) || '失敗';

async function fetchHistory(){
  if (busy) return;
  busy = true; lastTry = Date.now();
  const n = loaded ? 10 : 30;
  const tries = [
    ['P2P',   () => getJSON(API_P2P_BOTH + n)],
    ['P2P(地震のみ)', () => getJSON(API_P2P_EQ + n)],
    ['気象庁', () => getJSON(API_JMA).then(jmaToP2P)]
  ];
  const newErrs = {};
  try {
    for (const [name, fn] of tries) {
      try {
        const json = await fn();
        src = name === '気象庁' ? '気象庁' : 'p2p';
        errs = newErrs; fetchFailed = false;
        markUpdate(); updateDiag();
        ingest(json, loaded, true);
        return;
      } catch(e) { newErrs[name] = errText(e); }
    }
    errs = newErrs; fetchFailed = true; src = '';
    updateDiag(); render(false);
  } finally { busy = false; }
}

let retry = 0, retryTimer = 0;
function connectWS(){
  let ws, opened = false;
  try { ws = new WebSocket(API_WS); } catch(e) { wsErr = errText(e); updateDiag(); return scheduleWS(); }
  ws.onopen = () => { opened = true; wsOK = true; wsErr = ''; retry = 0; updateDiag(); setStatus(); fetchHistory(); };
  ws.onmessage = e => { try { markUpdate(); ingest([JSON.parse(e.data)], true); } catch(_) {} };
  ws.onclose = () => {
    wsOK = false;
    if (!opened) wsErr = '接続できません(再試行中)';
    updateDiag(); setStatus(); scheduleWS();
  };
  ws.onerror = () => { try { ws.close(); } catch(_) {} };
}
function scheduleWS(){
  if (retryTimer) return;
  retryTimer = setTimeout(() => { retryTimer = 0; connectWS(); }, Math.min(10000, 1000 * Math.pow(2, retry++)));
}

/* ---- 起動 ---- */
setInterval(() => { const r = $('rel'); if (r) r.textContent = rel(+r.dataset.t); }, 1000);
setInterval(() => {
  if (wsOK && loaded) return;
  if (src === '気象庁' && Date.now() - lastTry < 15000) return;
  fetchHistory();
}, 3000);
setInterval(() => { if (wsOK) fetchHistory(); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) fetchHistory(); });
document.addEventListener('click', initAudio, {once:true});
render(false);
fetchHistory();
connectWS();
})();
</script>
</body>
</html>
