<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>リアルタイム地震モニター</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#07080d;--glass:rgba(14,16,24,.82);--line:rgba(255,255,255,.09);--txt:#eef1f7;--sub:#8b93a7;--acc:#22d3ee;--red:#ff3b6b;--amb:#ffb020;--ok:#34e89e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none;font-family:-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;color:var(--txt);-webkit-text-size-adjust:100%}
#map{position:absolute;inset:0;background:var(--bg)}
.leaflet-tile{filter:grayscale(100%) invert(100%) contrast(380%) brightness(75%) hue-rotate(185deg) saturate(.6)}
.leaflet-top.leaflet-right{margin-top:env(safe-area-inset-top,0);margin-right:env(safe-area-inset-right,0)}
.leaflet-control-zoom a{background:var(--glass)!important;color:var(--txt)!important;border:1px solid var(--line)!important;backdrop-filter:blur(10px);width:36px!important;height:36px!important;line-height:36px!important}
.leaflet-control-attribution{background:rgba(7,8,13,.7)!important;color:var(--sub)!important;font-size:9px}
.leaflet-control-attribution a{color:var(--sub)!important}
.leaflet-tooltip{background:rgba(14,16,24,.92);color:var(--txt);border:1px solid var(--line);font-weight:700}
.leaflet-tooltip:before{display:none}
#panel{position:absolute;top:14px;left:14px;z-index:1000;width:330px;max-width:calc(100vw - 28px);max-height:calc(100% - 28px);display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.6);overflow:hidden}
#grip{display:none;padding:8px 0 2px;cursor:grab;touch-action:none}
#grip i{display:block;width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.28);margin:0 auto}
.head{display:flex;align-items:center;gap:8px;padding:12px 14px 6px;touch-action:none}
.title{flex:1;font-size:14px;font-weight:800;letter-spacing:.04em}
.title small{display:block;font-size:10px;font-weight:500;color:var(--sub);letter-spacing:.08em}
.status{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.06);color:var(--sub);white-space:nowrap}
.status:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.status.ok{color:var(--ok);background:rgba(52,232,158,.12)}
.status.ok:before{animation:blink 1.6s infinite}
.status.warn{color:var(--amb);background:rgba(255,176,32,.12)}
.status.err{color:var(--red);background:rgba(255,59,107,.12)}
@keyframes blink{50%{opacity:.25}}
button{font:inherit;background:rgba(255,255,255,.06);color:var(--txt);border:1px solid var(--line);border-radius:10px;font-size:12px;font-weight:600;padding:8px 10px;cursor:pointer;min-height:38px;transition:.15s;touch-action:manipulation}
button:active{background:rgba(255,255,255,.18)}
button.on{background:rgba(34,211,238,.16);border-color:rgba(34,211,238,.5);color:var(--acc)}
#btnMin{width:38px;padding:0;border-radius:50%}
.upd{display:flex;align-items:center;gap:6px;margin:2px 14px 8px;padding:7px 10px;border-radius:8px;background:rgba(255,255,255,.04);font:600 11px ui-monospace,Menlo,monospace;color:var(--sub)}
.upd b{color:var(--txt);font-weight:700}
.upd.err b{color:var(--red)}
.tools{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.tools button{flex:1 1 22%;padding:8px 4px;white-space:nowrap}
.main{padding:14px;border-top:1px solid var(--line);position:relative}
.main:before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 0 0,var(--glow,transparent),transparent 60%);opacity:.18;pointer-events:none}
.t{font-size:11px;color:var(--sub);margin-bottom:4px}
.name{font-size:20px;font-weight:900;margin-bottom:12px;line-height:1.25}
.name em{font-style:normal;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;margin-left:8px;vertical-align:middle;background:var(--red);color:#fff}
.metrics{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.m{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;text-align:center;padding:9px 4px}
.m i{display:block;font-style:normal;font-size:10px;color:var(--sub);margin-bottom:3px}
.m b{font-size:20px;font-weight:900}
.m.big b{font-size:30px;line-height:1;text-shadow:0 0 18px currentColor}
.note{font-size:12px;margin-top:10px;color:var(--sub);line-height:1.5}
.note.alert{color:var(--amb);background:rgba(255,176,32,.1);padding:8px 10px;border-radius:8px}
.msg{padding:26px 14px;font-size:13px;color:var(--sub);text-align:center;line-height:1.7}
.hist{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-top:1px solid var(--line);padding:6px}
.hist::-webkit-scrollbar{width:6px}.hist::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
.item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;transition:.15s;min-height:48px}
.item:active{background:rgba(255,255,255,.08)}
.item.active{background:rgba(34,211,238,.12);box-shadow:inset 3px 0 var(--acc)}
.badge{flex:none;width:42px;text-align:center;font:900 12px ui-monospace,monospace;padding:6px 0;border-radius:8px;color:#000}
.iname{flex:1;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.itime{flex:none;font-size:11px;color:var(--sub);font-family:ui-monospace,monospace}
.legend{display:flex;gap:3px;padding:8px 14px 12px;border-top:1px solid var(--line)}
.legend span{flex:1;text-align:center;font-size:9px;font-weight:900;color:#000;padding:3px 0;border-radius:5px}
#panel.min .main,#panel.min .hist,#panel.min .legend,#panel.min .tools{display:none}
.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* 強震モニタ小窓 */
#kmoni{position:absolute;z-index:900;top:14px;right:60px;width:360px;height:430px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.6);display:flex;flex-direction:column}
#kmoni[hidden]{display:none}
#kmoni .kh{display:flex;align-items:center;gap:10px;padding:6px 10px;font-size:12px}
#kmoni .kh b{flex:1}
#kmoni .kh a{color:var(--acc);font-size:11px}
#kmoni .kh button{min-height:28px;padding:2px 9px}
#kframe{flex:1;border:0;background:#fff}

@media(max-width:600px){
 #panel{top:auto;bottom:0;left:0;right:0;width:auto;max-width:none;height:46dvh;max-height:none;border-radius:20px 20px 0 0;border-bottom:none;padding-bottom:env(safe-area-inset-bottom,0);transition:height .25s ease}
 #panel.full{height:88dvh}
 #panel.min{height:auto}
 #grip{display:block}
 .head{padding:6px 14px 6px;padding-left:max(14px,env(safe-area-inset-left,0));padding-right:max(14px,env(safe-area-inset-right,0))}
 .name{font-size:19px;margin-bottom:10px}
 .main{padding:12px 14px}
 .m.big b{font-size:28px}
 .legend{padding-bottom:6px}
 .leaflet-control-attribution{margin-bottom:0}
 #kmoni{top:calc(10px + env(safe-area-inset-top,0));left:10px;right:56px;width:auto;height:38dvh}
}
@media(max-width:600px) and (max-height:520px){ #panel{height:70dvh} }
</style>
</head>
<body>
<div id="map"></div>
<div id="kmoni" hidden>
 <div class="kh"><b>強震モニタ(防災科研)</b><a href="https://www.kmoni.bosai.go.jp/" target="_blank" rel="noopener">別タブで開く</a><button id="kmoniX">✕</button></div>
 <iframe id="kframe" title="強震モニタ" referrerpolicy="no-referrer"></iframe>
</div>
<div id="panel">
 <div id="grip"><i></i></div>
 <div class="head" id="head">
  <div class="title">地震モニター<small>REALTIME EARTHQUAKE</small></div>
  <div id="status" class="status">接続中</div>
  <button id="btnMin" aria-label="開閉">－</button>
 </div>
 <div class="upd" id="upd">🕒 最終更新 <b>--:--:--</b></div>
 <div class="tools">
  <button id="btnFollow" class="on">自動追従</button>
  <button id="btnSound">🔇 音</button>
  <button id="btnJapan">全国</button>
  <button id="btnReload">更新</button>
  <button id="btnArea" class="on">震度塗り</button>
  <button id="btnKmoni">強震モニタ</button>
 </div>
 <div class="main" id="main"><div class="msg">地震情報を取得しています…</div></div>
 <div class="hist" id="hist"></div>
 <div class="legend" id="legend"></div>
</div>

<script>
(function(){
'use strict';
const API_HISTORY = 'https://api.p2pquake.net/v2/history?codes=551&codes=556&limit=';
const API_WS      = 'wss://api.p2pquake.net/v2/ws';
const WAVE_SEC = 150, MAX_ITEMS = 30;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isMobile = () => window.matchMedia('(max-width:600px)').matches;

if (typeof L === 'undefined') {
  $('main').innerHTML = '<div class="msg">地図ライブラリ(Leaflet)を読み込めませんでした。<br>インターネット接続を確認して再読み込みしてください。</div>';
  return;
}
const map = L.map('map', {zoomControl:false, tap:true}).setView([37.5,137.5], isMobile() ? 4 : 5);
L.control.zoom({position:'topright'}).addTo(map);
L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/blank/{z}/{x}/{y}.png', {
  maxZoom: 14, attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a> / <a href="https://www.p2pquake.net/">P2P地震情報</a>'
}).addTo(map);
const layer = L.layerGroup().addTo(map);

let events = [], selected = null, follow = true, sound = false;
let loaded = false, fetchFailed = false, wsOK = false, raf = 0, audio = null;

const SH = {10:['1','#cfd4dc'],20:['2','#22d3ee'],30:['3','#34e89e'],40:['4','#ffe83a'],45:['5弱','#ffa31a'],46:['5弱~','#ffa31a'],50:['5強','#ff5a1f'],55:['6弱','#ff2d6f'],60:['6強','#e00020'],70:['7','#d946ef']};
const shText  = s => SH[s] ? SH[s][0] : '-';
const shColor = s => s === -2 ? '#ff2d6f' : (SH[s] ? SH[s][1] : '#5b6275');
$('legend').innerHTML = [10,20,30,40,45,50,55,60,70].map(s => `<span style="background:${shColor(s)}">${SH[s][0]}</span>`).join('');

function parseTime(s){
  const m = String(s||'').match(/(\d{4})\/(\d{1,2})\/(\d{1,2}) (\d{1,2}):(\d{2})(?::(\d{2}))?/);
  return m ? new Date(+m[1], m[2]-1, +m[3], +m[4], +m[5], +(m[6]||0)) : new Date();
}
const p2 = n => String(n).padStart(2,'0');
const hms = d => `${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;
const fmt = d => `${d.getMonth()+1}/${d.getDate()} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
function rel(t){
  const s = Math.max(0, Math.floor((Date.now()-t)/1000));
  return s<60 ? s+'秒前' : s<3600 ? Math.floor(s/60)+'分前' : s<86400 ? Math.floor(s/3600)+'時間前' : Math.floor(s/86400)+'日前';
}

/* 最終更新 = データを受信した時刻。通信エラー時だけ警告を重ねる */
let lastData = null;
function renderUpd(errAt){
  const box = $('upd');
  box.classList.toggle('err', !!errAt);
  const base = lastData ? `最終更新 <b>${hms(lastData)}</b>` : '最終更新 <b>--:--:--</b>';
  box.innerHTML = errAt ? `⚠ 取得失敗 <b>${hms(errAt)}</b> / ${base}` : `🕒 ${base}`;
}

/* 都道府県ごとの最大震度(観測点データから) */
function prefMax(d){
  const m = {};
  (d.points||[]).forEach(p => { if (p.pref && p.scale > (m[p.pref]||0)) m[p.pref] = p.scale; });
  return m;
}
/* [緯度, 経度, 半径m(省略時28km)] */
const PREF = {北海道:[43,142.5,60000],青森県:[40.82,140.74],岩手県:[39.7,141.15],宮城県:[38.27,140.87],秋田県:[39.72,140.1],山形県:[38.24,140.36],福島県:[37.75,140.47],茨城県:[36.34,140.45],栃木県:[36.57,139.88],群馬県:[36.39,139.06],埼玉県:[35.86,139.65],千葉県:[35.6,140.12],東京都:[35.69,139.69],神奈川県:[35.45,139.64],新潟県:[37.9,139.02],富山県:[36.7,137.21],石川県:[36.59,136.63],福井県:[36.07,136.22],山梨県:[35.66,138.57],長野県:[36.65,138.18],岐阜県:[35.39,136.72],静岡県:[34.98,138.38],愛知県:[35.18,136.91],三重県:[34.73,136.51],滋賀県:[35,135.87],京都府:[35.02,135.76],大阪府:[34.69,135.52],兵庫県:[34.69,135.18],奈良県:[34.69,135.83],和歌山県:[34.23,135.17],鳥取県:[35.5,134.24],島根県:[35.47,133.05],岡山県:[34.66,133.93],広島県:[34.4,132.46],山口県:[34.19,131.47],徳島県:[34.07,134.56],香川県:[34.34,134.04],愛媛県:[33.84,132.77],高知県:[33.56,133.53],福岡県:[33.61,130.42],佐賀県:[33.25,130.3],長崎県:[32.74,129.87],熊本県:[32.79,130.74],大分県:[33.24,131.61],宮崎県:[31.91,131.42],鹿児島県:[31.56,130.56],沖縄県:[26.21,127.68]};
let areaOn = true;
function drawAreas(eq){
  if (!areaOn || !eq.prefs) return;
  Object.keys(eq.prefs).forEach(k => {
    const p = PREF[k], s = eq.prefs[k]; if (!p) return;
    L.circle([p[0], p[1]], {radius:p[2]||28000, color:shColor(s), weight:1, fillColor:shColor(s), fillOpacity:.38})
      .bindTooltip(`${k} 震度${shText(s)}`).addTo(layer);
  });
}

function toEvent(d){
  if (!d || d.test) return null;
  const eq = d.earthquake || {}, hy = eq.hypocenter || {};
  const lat = hy.latitude > 0 && hy.latitude < 90 ? hy.latitude : null;
  const lng = hy.longitude > 0 && hy.longitude < 180 ? hy.longitude : null;
  const mag = hy.magnitude > 0 ? 'M' + hy.magnitude.toFixed(1) : '-';
  const depth = hy.depth === 0 ? 'ごく浅い' : hy.depth > 0 ? hy.depth + 'km' : '-';
  if (d.code === 551) {
    return {key:'q'+(d.id||d.time), eew:false, time:parseTime(eq.time||d.time), name:hy.name||'震源調査中',
            lat, lng, mag, depth, scale:eq.maxScale>0?eq.maxScale:-1, tsunami:eq.domesticTsunami||'', prefs:prefMax(d)};
  }
  if (d.code === 556) {
    let exp = -1;
    (d.areas||[]).forEach(a => { const v = (a.scaleTo>0 && a.scaleTo<99) ? a.scaleTo : a.scaleFrom; if (v > exp) exp = v; });
    return {key:'e'+((d.issue&&d.issue.eventId)||d.id), eew:true, time:parseTime(eq.originTime||eq.arrivalTime||d.time),
            name:hy.name||'震源不明', lat, lng, mag, depth, scale:-2, expected:exp, cancelled:!!d.cancelled, tsunami:''};
  }
  return null;
}
const isLive = e => e.eew && !e.cancelled && (Date.now()-e.time)/1000 < WAVE_SEC;

function ingest(arr, realtime, poll){
  let newest = null;
  arr.forEach(d => {
    const ev = toEvent(d); if (!ev) return;
    const i = events.findIndex(x => x.key === ev.key);
    if (i < 0) { events.push(ev); if (realtime) newest = ev; }
    else { events[i] = ev; if (realtime && !poll) newest = ev; }
  });
  events.sort((a,b) => b.time - a.time);
  events = events.slice(0, MAX_ITEMS);
  loaded = true;
  let move = false;
  if (newest && follow) { selected = newest.key; move = true; }
  if (!events.some(e => e.key === selected)) { selected = events[0] && events[0].key; move = true; }
  if (newest && newest.eew && newest.lat) beep();
  render(move);
}

function render(moveMap){
  setStatus();
  if (!loaded) {
    $('main').innerHTML = fetchFailed
      ? '<div class="msg">地震情報を取得できません。<br>通信状況を確認してください。<br>自動で再試行しています。</div>'
      : '<div class="msg">地震情報を取得しています…</div>';
    $('hist').innerHTML = ''; return;
  }
  const eq = events.find(e => e.key === selected);
  if (!eq) { $('main').innerHTML = '<div class="msg">表示できる地震情報がありません</div>'; $('hist').innerHTML = ''; return; }
  const live = isLive(eq);
  const tsu = eq.tsunami && !['None','Unknown','NonEffective','Checking'].includes(eq.tsunami);
  const sc = eq.eew ? eq.expected : eq.scale;
  $('main').style.setProperty('--glow', shColor(sc));
  $('main').innerHTML = `
    <div class="t">${fmt(eq.time)} 発生 ・ <span id="rel" data-t="${+eq.time}">${rel(eq.time)}</span></div>
    <div class="name">${esc(eq.name)}${eq.eew?`<em>${eq.cancelled?'取消':'速報'}</em>`:''}</div>
    <div class="metrics">
      <div class="m big"><i>${eq.eew?'予測震度':'最大震度'}</i><b style="color:${shColor(sc)}">${shText(sc)}</b></div>
      <div class="m"><i>規模</i><b>${eq.mag}</b></div>
      <div class="m"><i>深さ</i><b style="font-size:14px">${eq.depth}</b></div>
    </div>
    ${live ? '<div class="note alert">⚠ 緊急地震速報 発表中 ― 青:P波 / 赤:S波 の推定範囲</div>' : ''}
    ${tsu ? '<div class="note alert">🌊 津波に関する情報があります。気象庁の発表を確認してください</div>' : ''}
    ${eq.lat ? '' : '<div class="note">震源の位置は未確定のため地図には表示されません</div>'}`;
  $('hist').innerHTML = events.map(e => `
    <div class="item ${e.key===selected?'active':''}" data-k="${esc(e.key)}">
      <div class="badge" style="background:${shColor(e.scale)}">${e.eew?'EEW':shText(e.scale)}</div>
      <div class="iname">${esc(e.name)}${e.cancelled?'（取消）':''}</div>
      <div class="itime">${fmt(e.time).split(' ')[1]}</div>
    </div>`).join('');
  drawMap(eq, moveMap);
}

/* スマホではシートに隠れない位置(上側)へ震源を寄せる */
function focusOn(lat, lng){
  map.setView([lat, lng], Math.max(map.getZoom(), 6), {animate:false});
  if (isMobile()) map.panBy([0, $('panel').offsetHeight / 2], {animate:false});
}

function drawMap(eq, moveMap){
  layer.clearLayers();
  if (raf) { cancelAnimationFrame(raf); raf = 0; }
  drawAreas(eq);
  if (!eq.lat) return;
  const live = isLive(eq);
  const svg = `<svg width="30" height="30" viewBox="0 0 24 24" stroke="#ff2d6f" stroke-width="4" stroke-linecap="round" style="filter:drop-shadow(0 0 6px #ff2d6f)" class="${live?'pulse':''}"><line x1="4" y1="4" x2="20" y2="20"/><line x1="20" y1="4" x2="4" y2="20"/></svg>`;
  L.marker([eq.lat, eq.lng], {icon:L.divIcon({className:'', html:svg, iconSize:[30,30], iconAnchor:[15,15]}), interactive:false}).addTo(layer);
  if (moveMap) focusOn(eq.lat, eq.lng);
  if (live) {
    const pw = L.circle([eq.lat, eq.lng], {radius:1, color:'#22d3ee', weight:2, fill:false, interactive:false}).addTo(layer);
    const sw = L.circle([eq.lat, eq.lng], {radius:1, color:'#ff2d6f', weight:2, fillColor:'#ff2d6f', fillOpacity:.15, interactive:false}).addTo(layer);
    const tick = () => {
      const t = (Date.now() - eq.time) / 1000;
      if (t > WAVE_SEC) { render(false); return; }
      pw.setRadius(Math.max(1, t*7000));
      sw.setRadius(Math.max(1, t*4000));
      raf = requestAnimationFrame(tick);
    };
    tick();
  }
}

function setStatus(){
  const s = $('status');
  if (wsOK) { s.className = 'status ok'; s.textContent = 'リアルタイム'; }
  else if (loaded && !fetchFailed) { s.className = 'status warn'; s.textContent = '定期更新 3秒'; }
  else if (fetchFailed) { s.className = 'status err'; s.textContent = '通信エラー'; }
  else { s.className = 'status warn'; s.textContent = '接続中'; }
}

/* ---- 操作 ---- */
$('hist').addEventListener('click', e => {
  const it = e.target.closest('.item'); if (!it) return;
  selected = it.dataset.k; render(true);
});
$('btnFollow').onclick = function(){ follow = !follow; this.classList.toggle('on', follow); };
$('btnSound').onclick = function(){
  sound = !sound; this.classList.toggle('on', sound); this.textContent = sound ? '🔔 音' : '🔇 音';
  if (sound) { initAudio(); beep(); }
};
$('btnJapan').onclick = () => map.setView([37.5,137.5], isMobile() ? 4 : 5);
$('btnReload').onclick = () => fetchHistory();
$('btnArea').onclick = function(){ areaOn = !areaOn; this.classList.toggle('on', areaOn); render(false); };
$('btnKmoni').onclick = function(){
  const w = $('kmoni'), show = w.hidden;
  w.hidden = !show; this.classList.toggle('on', show);
  if (show && !$('kframe').src) $('kframe').src = 'https://www.kmoni.bosai.go.jp/';
};
$('kmoniX').onclick = () => { $('kmoni').hidden = true; $('btnKmoni').classList.remove('on'); };

/* シート開閉(スマホ): つまみ/ヘッダーをスワイプ or タップ */
const panel = $('panel'), btnMin = $('btnMin');
function setState(st){
  panel.classList.toggle('min', st === 'min');
  panel.classList.toggle('full', st === 'full');
  btnMin.textContent = st === 'min' ? '＋' : '－';
}
const curState = () => panel.classList.contains('min') ? 'min' : panel.classList.contains('full') ? 'full' : 'mid';
btnMin.onclick = () => setState(curState() === 'min' ? 'mid' : 'min');
(function swipe(){
  let y0 = null;
  const start = e => { y0 = e.touches[0].clientY; };
  const end = e => {
    if (y0 == null) return;
    const dy = e.changedTouches[0].clientY - y0; y0 = null;
    if (!isMobile() || Math.abs(dy) < 30) return;
    const s = curState();
    if (dy < 0) setState(s === 'min' ? 'mid' : 'full');
    else setState(s === 'full' ? 'mid' : 'min');
  };
  ['grip','head'].forEach(id => {
    $(id).addEventListener('touchstart', start, {passive:true});
    $(id).addEventListener('touchend', end, {passive:true});
  });
  $('grip').addEventListener('click', () => { if (isMobile()) setState(curState() === 'min' ? 'mid' : 'min'); });
})();

/* ---- 音 ---- */
function initAudio(){
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
  } catch(e) {}
}
function beep(){
  if (!sound || !audio) return;
  [0,.35,.7].forEach(t => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = 'square'; o.frequency.value = 880; g.gain.value = .08;
    o.connect(g); g.connect(audio.destination);
    o.start(audio.currentTime + t); o.stop(audio.currentTime + t + .2);
  });
}

/* ---- 通信 ---- */
let fetching = false;
async function fetchHistory(){
  if (fetching) return;
  fetching = true;
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 10000);
  try {
    const r = await fetch(API_HISTORY + (loaded ? 10 : 30), {signal: ctl.signal});
    if (!r.ok) throw new Error(r.status);
    const json = await r.json();
    fetchFailed = false;
    ingest(json, loaded, true);
    lastData = new Date();      /* データを受信できたら必ず更新 */
    renderUpd(null);
  } catch(e) {
    fetchFailed = true;
    renderUpd(new Date());
    render(false);
  } finally { clearTimeout(to); fetching = false; }
}

let retry = 0, retryTimer = 0, openAt = 0;
function connectWS(){
  let ws;
  try { ws = new WebSocket(API_WS); } catch(e) { return scheduleWS(); }
  ws.onopen = () => {
    wsOK = true; openAt = Date.now(); setStatus();
    if (!loaded) fetchHistory();          /* 初回だけ履歴取得 */
  };
  ws.onmessage = e => {
    try {
      ingest([JSON.parse(e.data)], true);
      lastData = new Date();    /* 受信したら必ず更新 */
      renderUpd(null);
    } catch(_) {}
  };
  ws.onclose = () => {
    wsOK = false; setStatus();
    if (Date.now() - openAt > 10000) retry = 0;   /* 10秒以上安定したときだけリセット */
    scheduleWS();
  };
  ws.onerror = () => { try { ws.close(); } catch(_) {} };
}
function scheduleWS(){
  if (retryTimer) return;
  retryTimer = setTimeout(() => { retryTimer = 0; connectWS(); }, Math.min(30000, 2000 * Math.pow(2, retry++)));
}

/* ---- 起動 ---- */
setInterval(() => { const r = $('rel'); if (r) r.textContent = rel(+r.dataset.t); }, 1000);
setInterval(() => { if (!wsOK || !loaded) fetchHistory(); }, 3000);   /* WS不通時のみ3秒ポーリング */
setInterval(() => { if (wsOK) fetchHistory(); }, 30000);               /* WS接続中の取りこぼし補完 */
document.addEventListener('visibilitychange', () => { if (!document.hidden) fetchHistory(); });
window.addEventListener('resize', () => map.invalidateSize());
window.addEventListener('orientationchange', () => setTimeout(() => map.invalidateSize(), 300));
document.addEventListener('click', initAudio, {once:true});
render(false);
fetchHistory();
connectWS();
})();
</script>
