<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQ MONITOR LIVE - 安定動作版</title>

    <!-- CDNをunpkgに変更して安定化 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-dark: #000000;
            --panel-bg: rgba(10, 15, 25, 0.92);
            --border-color: rgba(0, 210, 255, 0.3);
            --font-mono: 'JetBrains Mono', 'Consolas', monospace;
            --eew-red: #ff0055;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif; color: #fff; }

        /* 地図領域の完全確保 */
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; background: #050a14; }
        .leaflet-tile { filter: brightness(0.4) invert(100%) contrast(2.5) hue-rotate(190deg) saturate(0.2); }

        /* 波形アニメーション */
        .wave-p { stroke: #00d2ff; stroke-width: 2; fill: rgba(0, 210, 255, 0.05); stroke-dasharray: 4 4; pointer-events: none; }
        .wave-s { stroke: #ff0055; stroke-width: 3; fill: rgba(255, 0, 85, 0.15); pointer-events: none; }

        .epicenter-marker { display: flex; justify-content: center; align-items: center; }
        .epicenter-cross { font-size: 32px; font-weight: 900; color: #ff0055; text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055; animation: eq-pulse 0.6s infinite alternate ease-in-out; }
        @keyframes eq-pulse { from { transform: scale(0.8); } to { transform: scale(1.4); } }

        /* UIパネル */
        #ui-container { position: absolute; top: 12px; left: 12px; z-index: 1000; width: 340px; max-width: calc(100vw - 24px); }
        .eq-panel { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.8); backdrop-filter: blur(10px); }

        .eq-header { padding: 8px 12px; background: rgba(0, 210, 255, 0.1); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .brand-title { font-size: 12px; font-weight: 900; color: #00d2ff; letter-spacing: 0.1em; }

        .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; font-size: 11px; background: rgba(0,0,0,0.6); border-bottom: 1px solid rgba(255,255,255,0.08); font-family: var(--font-mono); }
        .dot-live { width: 8px; height: 8px; border-radius: 50%; background: #00ff88; box-shadow: 0 0 8px #00ff88; }
        .dot-live.polling { background: #ffaa00; box-shadow: 0 0 8px #ffaa00; }
        .dot-live.offline { background: #ff0055; box-shadow: 0 0 8px #ff0055; }

        .eew-alert-banner { background: linear-gradient(90deg, #ff0055, #b40000); color: #fff; font-size: 13px; font-weight: 900; text-align: center; padding: 6px 0; letter-spacing: 0.15em; display: none; }

        .eq-body { padding: 12px; }
        .eq-title { font-size: 20px; font-weight: 900; color: #fff; margin-bottom: 8px; line-height: 1.2; }

        .metrics-table { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
        .metric-cell { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); padding: 6px; border-radius: 4px; text-align: center; }
        .metric-label { font-size: 9px; color: #8a99ad; font-weight: 700; }
        .metric-value { font-size: 16px; font-weight: 900; font-family: var(--font-mono); margin-top: 2px; }

        /* 凡例バー */
        #legend-container { position: absolute; bottom: 20px; right: 16px; z-index: 1000; background: rgba(0,0,0,0.85); border: 1px solid var(--border-color); border-radius: 6px; padding: 8px 12px; font-family: var(--font-mono); width: 220px; }
        .legend-title { font-size: 9px; color: #8a99ad; margin-bottom: 6px; text-align: center; font-weight: 800; }
        .legend-bar { display: flex; height: 12px; border-radius: 3px; overflow: hidden; margin-bottom: 4px; border: 1px solid rgba(255,255,255,0.2); }
        .legend-seg { flex: 1; }
        .legend-labels { display: flex; justify-content: space-between; color: #ccc; font-size: 8px; }

        #history-list { max-height: 140px; overflow-y: auto; padding: 8px 12px; display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--border-color); }
        .history-item { display: grid; grid-template-columns: 42px 1fr auto; align-items: center; gap: 8px; padding: 5px 8px; background: rgba(255,255,255,0.02); border-radius: 4px; cursor: pointer; font-size: 11px; }
        .history-item:hover { background: rgba(0,210,255,0.1); }
        .shindo-badge { text-align: center; font-weight: 900; padding: 2px 0; border-radius: 3px; color: #000; font-family: var(--font-mono); }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="ui-container">
        <div class="eq-panel">
            <div class="eq-header">
                <div class="brand-title">EQ MONITOR LIVE</div>
                <span style="font-size: 9px; color: #8a99ad; font-family: var(--font-mono);">強震観測網</span>
            </div>

            <div id="eew-banner" class="eew-alert-banner">🚨 緊急地震速報</div>

            <div class="status-bar">
                <div style="display:flex; align-items:center; gap:6px;">
                    <div id="live-dot" class="dot-live offline"></div>
                    <span id="status-text">データ通信準備中</span>
                </div>
                <div id="clock-text" style="color:#00d2ff;">--:--:--</div>
            </div>

            <div id="eq-content" class="eq-body">
                <div style="text-align:center; font-size:11px; color:#64748b; padding: 10px 0;">取得中...</div>
            </div>

            <div id="history-list"></div>
        </div>
    </div>

    <div id="legend-container">
        <div class="legend-title">リアルタイム震度 (強震モニタ配色)</div>
        <div class="legend-bar">
            <div class="legend-seg" style="background:#002244;"></div>
            <div class="legend-seg" style="background:#0077ff;"></div>
            <div class="legend-seg" style="background:#00ffaa;"></div>
            <div class="legend-seg" style="background:#00ff00;"></div>
            <div class="legend-seg" style="background:#ffff00;"></div>
            <div class="legend-seg" style="background:#ff9900;"></div>
            <div class="legend-seg" style="background:#ff0055;"></div>
            <div class="legend-seg" style="background:#b40000;"></div>
            <div class="legend-seg" style="background:#e600ff;"></div>
        </div>
        <div class="legend-labels">
            <span>0未満</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span>
        </div>
    </div>

    <script>
        // 地図の初期化 (フォールバック対応の標準OSMタイル)
        const map = L.map('map', { zoomControl: false }).setView([37.5, 137.5], 5);
        
        // 確実に読み込める標準タイルを使用
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);

        // 地図サイズ崩れ防止
        setTimeout(() => { map.invalidateSize(); }, 500);

        const activeLayerGroup = L.layerGroup().addTo(map);
        const obsPointsLayerGroup = L.layerGroup().addTo(map);

        let earthquakeList = [];
        let obsPoints = [];
        let wsInstance = null;
        let pollingTimer = null;
        let animFrameId = null;

        setInterval(() => {
            document.getElementById('clock-text').textContent = new Date().toLocaleTimeString('ja-JP');
        }, 1000);

        function getKyoshinColor(scale) {
            if (scale >= 65) return "#e600ff";
            if (scale >= 55) return "#b40000";
            if (scale >= 45) return "#ff0055";
            if (scale >= 35) return "#ff9900";
            if (scale >= 25) return "#ffff00";
            if (scale >= 15) return "#00ff00";
            if (scale >= 5)  return "#00ffaa";
            if (scale >= 0)  return "#0077ff";
            return "#002244";
        }

        function parseScaleText(scale) {
            const map = { 10: "1", 20: "2", 30: "3", 40: "4", 45: "5弱", 50: "5強", 55: "6弱", 60: "6強", 70: "7" };
            return map[scale] || "不明";
        }

        function generateJapanObsGrid() {
            obsPoints = [];
            for (let lat = 28.0; lat <= 45.5; lat += 0.4) {
                for (let lng = 128.0; lng <= 145.5; lng += 0.4) {
                    if (isRoughJapanLand(lat, lng)) {
                        obsPoints.push({ lat, lng, currentScale: -10, marker: null });
                    }
                }
            }

            obsPoints.forEach(pt => {
                const marker = L.circleMarker([pt.lat, pt.lng], {
                    radius: 2.5,
                    fillColor: getKyoshinColor(-10),
                    color: "rgba(0,0,0,0.5)",
                    weight: 0.5,
                    fillOpacity: 0.7
                });
                pt.marker = marker;
                obsPointsLayerGroup.addLayer(marker);
            });
        }

        function isRoughJapanLand(lat, lng) {
            if (lat < 30.0 && lng < 131.0) return lat > 26.0 && lng > 127.0;
            if (lat >= 30.0 && lat <= 35.0 && lng >= 129.0 && lng <= 136.0) return true;
            if (lat >= 34.0 && lat <= 38.0 && lng >= 135.0 && lng <= 141.0) return true;
            if (lat >= 37.0 && lat <= 41.5 && lng >= 138.0 && lng <= 142.0) return true;
            if (lat >= 41.5 && lat <= 45.5 && lng >= 139.5 && lng <= 145.5) return true;
            return false;
        }

        function startRealtimeSimulation(lat, lng, originTimeMs, depth, maxScale) {
            if (animFrameId) cancelAnimationFrame(animFrameId);

            const pCircle = L.circle([lat, lng], { className: 'wave-p', radius: 0 }).addTo(activeLayerGroup);
            const sCircle = L.circle([lat, lng], { className: 'wave-s', radius: 0 }).addTo(activeLayerGroup);

            const pSpeed = 6.5;
            const sSpeed = 3.5;

            function loop() {
                const elapsedSec = (Date.now() - originTimeMs) / 1000;

                if (elapsedSec >= 0 && elapsedSec <= 240) {
                    const pDistKm = Math.max(0, Math.sqrt(Math.pow(pSpeed * elapsedSec, 2) - Math.pow(depth, 2)) || 0);
                    const sDistKm = Math.max(0, Math.sqrt(Math.pow(sSpeed * elapsedSec, 2) - Math.pow(depth, 2)) || 0);

                    pCircle.setRadius(pDistKm * 1000);
                    sCircle.setRadius(sDistKm * 1000);

                    obsPoints.forEach(pt => {
                        const distKm = getDistanceKm(lat, lng, pt.lat, pt.lng);
                        let calculatedScale = -10;

                        if (sDistKm >= distKm) {
                            const attenuation = Math.max(0, 1 - (distKm / (maxScale * 35)));
                            calculatedScale = (maxScale * attenuation) - (elapsedSec - (distKm / sSpeed)) * 0.1;
                        } else if (pDistKm >= distKm) {
                            calculatedScale = Math.min(10, maxScale * 0.15);
                        }

                        if (calculatedScale !== pt.currentScale) {
                            pt.currentScale = calculatedScale;
                            pt.marker.setStyle({
                                fillColor: getKyoshinColor(calculatedScale),
                                radius: calculatedScale > 20 ? 4.5 : 2.5,
                                fillOpacity: calculatedScale > 0 ? 0.95 : 0.6
                            });
                        }
                    });

                    const timerEl = document.getElementById('wave-timer-val');
                    if (timerEl) timerEl.textContent = `${elapsedSec.toFixed(1)}s`;

                    animFrameId = requestAnimationFrame(loop);
                }
            }
            loop();
        }

        function getDistanceKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function updateDisplay(index = 0) {
            const data = earthquakeList[index];
            if (!data) return;

            if (animFrameId) cancelAnimationFrame(animFrameId);
            activeLayerGroup.clearLayers();
            renderHistoryList();

            const isEEW = data.code === 556;
            const hypo = isEEW ? (data.hypothesis || {}) : (data.earthquake?.hypocenter || {});
            const scaleVal = isEEW ? hypo.maxScale : data.earthquake?.maxScale;
            const originTimeStr = isEEW ? data.time : (data.earthquake?.time || data.time);
            const originTimeMs = originTimeStr ? new Date(originTimeStr).getTime() : Date.now();

            document.getElementById('eew-banner').style.display = isEEW ? 'block' : 'none';

            document.getElementById('eq-content').innerHTML = `
                <div style="font-size: 10px; color: ${isEEW ? 'var(--eew-red)' : '#00d2ff'}; font-weight:800;">
                    ${isEEW ? '🚨 緊急地震速報' : (originTimeStr ? new Date(originTimeStr).toLocaleString('ja-JP') : '発生時刻不明')}
                </div>
                <div class="eq-title">${hypo.name || '震源解析中'}</div>
                <div class="metrics-table">
                    <div class="metric-cell">
                        <div class="metric-label">最大震度</div>
                        <div class="metric-value" style="color:${getKyoshinColor(scaleVal)}">${parseScaleText(scaleVal)}</div>
                    </div>
                    <div class="metric-cell">
                        <div class="metric-label">規模</div>
                        <div class="metric-value">M${hypo.magnitude > 0 ? hypo.magnitude : '?'}</div>
                    </div>
                    <div class="metric-cell">
                        <div class="metric-label">深さ</div>
                        <div class="metric-value">${hypo.depth >= 0 ? hypo.depth + 'km' : '不明'}</div>
                    </div>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px; font-size:10px; color:#8a99ad; font-family:var(--font-mono);">
                    <span>波形到達経過:</span>
                    <span id="wave-timer-val" style="color:#00d2ff; font-weight:900;">0.0s</span>
                </div>
            `;

            if (hypo.latitude && hypo.longitude && hypo.latitude !== -1) {
                const icon = L.divIcon({ className: 'epicenter-marker', html: '<div class="epicenter-cross">✖</div>' });
                L.marker([hypo.latitude, hypo.longitude], { icon }).addTo(activeLayerGroup);
                map.flyTo([hypo.latitude, hypo.longitude], 6.2, { duration: 0.8 });

                startRealtimeSimulation(hypo.latitude, hypo.longitude, originTimeMs, hypo.depth || 10, scaleVal || 10);
            }

            if (data.points && data.points.length > 0) {
                data.points.forEach(pt => {
                    L.circleMarker([pt.latitude, pt.longitude], {
                        radius: 4,
                        fillColor: getKyoshinColor(pt.scale),
                        color: "#ffffff",
                        weight: 0.8,
                        fillOpacity: 0.9
                    }).bindPopup(`<b>${pt.addr}</b><br>震度: ${parseScaleText(pt.scale)}`).addTo(activeLayerGroup);
                });
            }
        }

        function renderHistoryList() {
            const list = document.getElementById('history-list');
            list.innerHTML = '';

            earthquakeList.slice(0, 8).forEach((item, idx) => {
                const isEEW = item.code === 556;
                const hypo = isEEW ? (item.hypothesis || {}) : (item.earthquake?.hypocenter || {});
                const scaleVal = isEEW ? hypo.maxScale : item.earthquake?.maxScale;

                const row = document.createElement('div');
                row.className = 'history-item';
                row.onclick = () => updateDisplay(idx);

                row.innerHTML = `
                    <div class="shindo-badge" style="background:${getKyoshinColor(scaleVal)};">${parseScaleText(scaleVal)}</div>
                    <div style="font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${hypo.name || '震源地不明'}</div>
                    <div style="font-size:9px; color:#64748b; font-family:var(--font-mono);">${isEEW ? 'EEW' : '確定'}</div>
                `;
                list.appendChild(row);
            });
        }

        // --- データ取得ロジック（WebSocket＋自動HTTPポーリング切り替え） ---
        async function fetchLatestData() {
            try {
                const res = await fetch('https://api.p2pquake.net/v2/history?codes=551&codes=556&limit=10');
                const data = await res.json();
                if (data && data.length > 0) {
                    earthquakeList = data;
                    updateDisplay(0);
                }
            } catch (e) {
                console.error("API取得エラー", e);
            }
        }

        function startPollingMode() {
            const dot = document.getElementById('live-dot');
            const statusText = document.getElementById('status-text');
            
            dot.className = 'dot-live polling';
            statusText.textContent = "定期更新モード (3秒間隔)";

            if (!pollingTimer) {
                fetchLatestData();
                pollingTimer = setInterval(fetchLatestData, 3000); // 3秒ごとに最新データを取得
            }
        }

        function connectWebSocket() {
            const dot = document.getElementById('live-dot');
            const statusText = document.getElementById('status-text');

            try {
                wsInstance = new WebSocket('wss://api.p2pquake.net/v2/ws');

                wsInstance.onopen = () => {
                    if (pollingTimer) clearInterval(pollingTimer);
                    dot.className = 'dot-live';
                    statusText.textContent = "リアルタイムWebSocket接続中";
                };

                wsInstance.onmessage = (evt) => {
                    try {
                        const msg = JSON.parse(evt.data);
                        if (msg.code === 551 || msg.code === 556) {
                            const existIdx = earthquakeList.findIndex(e => e.id === msg.id);
                            if (existIdx !== -1) {
                                earthquakeList[existIdx] = msg;
                            } else {
                                earthquakeList.unshift(msg);
                                if (earthquakeList.length > 20) earthquakeList.pop();
                            }
                            updateDisplay(0);
                        }
                    } catch (e) {}
                };

                wsInstance.onerror = wsInstance.onclose = () => {
                    // WebSocketが失敗したら即座にポーリング（定期取得）に切り替え
                    startPollingMode();
                };

            } catch (e) {
                startPollingMode();
            }
        }

        window.onload = () => {
            generateJapanObsGrid();
            fetchLatestData();
            connectWebSocket();
        };
    </script>
</body>
</html>
